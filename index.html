    h += '<div style="padding:0 14px 14px;display:flex;gap:8px">'+
      '<button class="btn btn-outline btn-sm btn-block" onclick="App.state.estoqueFiltro=\'reposicao\';App.go(\'estoque\')"><i class="fa-solid fa-boxes-stacked"></i> Ver estoque</button>'+
      '<button class="btn btn-amber btn-sm btn-block" onclick="Reports.listaCompras()"><i class="fa-solid fa-cart-shopping"></i> Lista de compras</button>'+
    '</div>';
  }
  h += '</div>';

  /* ---- Consumo por obra (mês) ---- */
  const porObra = {};
  saidasMes.concat(diretasMes).forEach(m=>{
    if(!m.obraId) return;
    porObra[m.obraId]=(porObra[m.obraId]||0)+numRaw(m.valorTotal);
  });
  const obraArr = Object.keys(porObra).map(k=>({nome:nomeObra(k), v:porObra[k]})).sort((a,b)=>b.v-a.v);
  const maxObra = obraArr.length?obraArr[0].v:1;
  h += '<div class="card"><div class="card-head"><h3><i class="fa-solid fa-building-flag" style="color:var(--blue)"></i>Envio por obra — '+monthName(mk)+'</h3></div><div class="card-pad">';
  if(!obraArr.length) h += '<p class="muted" style="font-size:13px">Nenhum envio registrado neste mês.</p>';
  else obraArr.forEach(o=>{
    h += '<div class="barh"><div class="bh-label">'+esc(o.nome)+'</div>'+
      '<div class="bh-track"><div class="bh-fill" style="width:'+((o.v/maxObra)*100).toFixed(0)+'%"></div></div>'+
      '<div class="bh-val">'+moneyShort(o.v)+'</div></div>';
  });
  h += '</div></div>';
  h += '</div>';

  /* ---- Coluna direita ---- */
  h += '<div class="stack">';

  /* Últimas movimentações */
  const ult = movs.slice().sort((a,b)=>(b.data+b.criadoEm).localeCompare(a.data+a.criadoEm)).slice(0,8);
  h += '<div class="card"><div class="card-head"><h3><i class="fa-solid fa-clock-rotate-left" style="color:var(--gray-400)"></i>Últimas movimentações</h3>'+
       '<button class="btn btn-ghost btn-sm" onclick="App.go(\'movimentacoes\')">Ver todas <i class="fa-solid fa-chevron-right" style="font-size:9px"></i></button></div>';
  if(!ult.length) h += '<div style="padding:8px">'+emptyState('fa-inbox','Sem movimentações','Registre a primeira entrada ou saída.')+'</div>';
  else {
    h += '<div style="padding:8px 12px 12px" class="list">';
    ult.forEach(m=>h += movRow(m));
    h += '</div>';
  }
  h += '</div>';

  /* Top materiais consumidos */
  const cons = {};
  movs.filter(m=>(m.tipo==='saida'||m.tipo==='devolucao') && m.data>=daysAgo(90)).forEach(m=>{
    const v = numRaw(m.valorTotal) * (m.tipo==='devolucao'?-1:1);
    cons[m.materialId]=(cons[m.materialId]||0)+v;
  });
  const topArr = Object.keys(cons).map(k=>({nome:nomeMat(k), v:cons[k]})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,6);
  const maxTop = topArr.length?topArr[0].v:1;
  h += '<div class="card"><div class="card-head"><h3><i class="fa-solid fa-ranking-star" style="color:var(--green)"></i>Mais consumidos (90 dias)</h3></div><div class="card-pad">';
  if(!topArr.length) h += '<p class="muted" style="font-size:13px">Sem dados suficientes.</p>';
  else topArr.forEach(t=>{
    h += '<div class="barh"><div class="bh-label" title="'+esc(t.nome)+'">'+esc(t.nome)+'</div>'+
      '<div class="bh-track"><div class="bh-fill g" style="width:'+((t.v/maxTop)*100).toFixed(0)+'%"></div></div>'+
      '<div class="bh-val">'+moneyShort(t.v)+'</div></div>';
  });
  h += '</div></div>';

  h += '</div></div>';
  return h;
};

function kpi(color, icon, label, value, desc){
  return '<div class="kpi k-'+color+'"><div class="kl"><i class="fa-solid '+icon+'"></i>'+esc(label)+'</div>'+
    '<div class="kv">'+value+'</div><div class="kd">'+esc(desc||'')+'</div></div>';
}
function qa(cls, icon, title, sub, onclick){
  return '<button class="qa '+cls+'" onclick="'+onclick+'"><i class="fa-solid '+icon+'"></i>'+
    '<div class="qa-txt"><span>'+esc(title)+'</span><small>'+esc(sub)+'</small></div></button>';
}
function movRow(m){
  const t = MovTipo[m.tipo]||MovTipo.entrada;
  const sinal = (m.tipo==='saida')?'−':(m.tipo==='ajuste'&&numRaw(m.quantidade)<0?'−':'+');
  const q = Math.abs(numRaw(m.quantidade));
  return '<div class="item" onclick="Views.movDetalhe(\''+m.id+'\')">'+
    '<div class="item-top">'+
      '<div class="mv-icon '+t.cls+'"><i class="fa-solid '+t.icon+'"></i></div>'+
      '<div style="flex:1;min-width:0">'+
        '<div class="item-title" style="font-size:13.5px">'+esc(m.materialDesc||nomeMat(m.materialId))+'</div>'+
        '<div style="font-size:11.5px;color:var(--gray-500);margin-top:2px">'+esc(t.label)+' · '+fmtDate(m.data)+
          (m.destino?' · '+esc(m.destino):'')+'</div>'+
      '</div>'+
      '<div style="text-align:right;flex-shrink:0">'+
        '<div style="font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;color:'+(sinal==='−'?'var(--blue)':'var(--green)')+'">'+sinal+qty(q)+'</div>'+
        '<div style="font-size:10.5px;color:var(--gray-400);font-weight:700">'+esc(m.unidade||'')+'</div>'+
      '</div>'+
    '</div></div>';
}
</script>
<script>
/* ==========================================================================
   VIEW: ESTOQUE PRINCIPAL
   ========================================================================== */
Views.estoque = function(){
  const cfg = DB.config.get();
  const all = Stock.rows();
  const counts = {todos:all.length, normal:0, baixo:0, critico:0, zerado:0};
  all.forEach(r=>counts[r.status]++);
  const valor = all.filter(r=>r.ativo).reduce((s,r)=>s+r.valorTotal,0);

  let h = pageHead('fa-boxes-stacked','Estoque Principal', cfg.galpao+' · '+money(valor)+' em estoque',
    '<button class="btn btn-outline btn-sm" onclick="Reports.exportEstoqueCSV()"><i class="fa-solid fa-file-csv"></i> Exportar</button>'+
    '<button class="btn btn-outline btn-sm" onclick="Forms.novoAjuste()"><i class="fa-solid fa-scale-balanced"></i> Ajuste</button>'+
    '<button class="btn btn-primary btn-sm" onclick="Forms.novaSaida()"><i class="fa-solid fa-arrow-up"></i> Nova saída</button>');

  h += '<div class="filter-row">'+
    '<div class="searchbar"><i class="fa-solid fa-magnifying-glass"></i>'+
    '<input type="search" id="estBusca" placeholder="Buscar por nome, código ou categoria…" value="'+esc(App.state.estoqueBusca)+'"></div>'+
  '</div>';

  const chips = [['todos','Todos',counts.todos],['normal','Normal',counts.normal],['baixo','Estoque baixo',counts.baixo],
                 ['critico','Crítico',counts.critico],['zerado','Zerado',counts.zerado],['reposicao','Precisa repor',counts.baixo+counts.critico+counts.zerado]];
  h += '<div class="chips">';
  chips.forEach(c=>{ h += '<button class="chip'+(App.state.estoqueFiltro===c[0]?' active':'')+'" data-f="'+c[0]+'">'+esc(c[1])+' <span class="cnt">'+c[2]+'</span></button>'; });
  h += '</div>';

  h += '<div id="estLista"></div>';
  return h;
};
Views.dashboard_init = function(){
  Stories.ligar();
};

Views.estoque_init = function(){
  const inp = $('#estBusca');
  if(inp){
    inp.addEventListener('input', debounce(e=>{ App.state.estoqueBusca=e.target.value; renderEstoque(); },160));
  }
  $$('.chip[data-f]').forEach(b=>b.addEventListener('click',()=>{
    App.state.estoqueFiltro=b.dataset.f;
    $$('.chip[data-f]').forEach(x=>x.classList.toggle('active',x===b));
    renderEstoque();
  }));
  renderEstoque();
};
function filtraEstoque(){
  const q = (App.state.estoqueBusca||'').trim().toLowerCase();
  const f = App.state.estoqueFiltro;
  return Stock.rows().filter(r=>{
    if(f==='reposicao'){ if(r.status==='normal') return false; }
    else if(f!=='todos' && r.status!==f) return false;
    if(!q) return true;
    return (r.descricao+' '+r.codigo+' '+r.categoria+' '+(r.mat.ean||'')).toLowerCase().includes(q);
  }).sort((a,b)=>{
    const ord={zerado:0,critico:1,baixo:2,normal:3};
    if(ord[a.status]!==ord[b.status]) return ord[a.status]-ord[b.status];
    return a.descricao.localeCompare(b.descricao,'pt-BR');
  });
}
function renderEstoque(){
  const rows = filtraEstoque();
  const el = $('#estLista'); if(!el) return;
  if(!rows.length){ el.innerHTML='<div class="card">'+emptyState('fa-magnifying-glass','Nenhum material encontrado','Ajuste a busca ou os filtros.')+'</div>'; return; }

  /* Cards (mobile) */
  let cards = '<div class="list as-table">';
  rows.forEach(r=>{
    const pct = r.minimo>0 ? Math.min(100,(r.saldo/r.minimo)*100) : 100;
    cards += '<div class="item bl s-'+r.status+'" onclick="Views.estoqueDetalhe(\''+r.id+'\')">'+
      '<div class="item-top"><div style="flex:1;min-width:0">'+
        '<div class="item-code">'+esc(r.codigo)+' · '+esc(r.categoria)+'</div>'+
        '<div class="item-title">'+esc(r.descricao)+'</div></div>'+
        Stock.statusBadge(r.status)+'</div>'+
      '<div class="item-meta">'+
        '<div class="mi"><span>Estoque</span><b style="font-size:16px">'+qty(r.saldo)+' '+esc(r.unidade)+'</b></div>'+
        '<div class="mi"><span>Mínimo</span><b>'+qty(r.minimo)+'</b></div>'+
        '<div class="mi"><span>Custo médio</span><b>'+money(r.custo)+'</b></div>'+
        '<div class="mi"><span>Valor total</span><b>'+money(r.valorTotal)+'</b></div>'+
      '</div>'+
      '<div class="bar s-'+r.status+'"><div style="width:'+pct.toFixed(0)+'%"></div></div>'+
    '</div>';
  });
  cards += '</div>';

  /* Tabela (desktop) */
  let tb = '<div class="card table-wrap"><table><thead><tr>'+
    '<th>Código</th><th>Material</th><th>Categoria</th><th>Un.</th>'+
    '<th class="num">Estoque</th><th class="num">Mínimo</th><th class="num">Custo médio</th><th class="num">Valor total</th><th>Status</th>'+
    '</tr></thead><tbody>';
  rows.forEach(r=>{
    tb += '<tr onclick="Views.estoqueDetalhe(\''+r.id+'\')">'+
      '<td class="tsub tabular">'+esc(r.codigo)+'</td>'+
      '<td><div class="tm">'+esc(r.descricao)+'</div>'+(r.mat.ean?'<div class="tsub">EAN '+esc(r.mat.ean)+'</div>':'')+'</td>'+
      '<td><span class="badge b-gray">'+esc(r.categoria)+'</span></td>'+
      '<td class="tsub">'+esc(r.unidade)+'</td>'+
      '<td class="num" style="font-weight:800;font-size:14.5px">'+qty(r.saldo)+'</td>'+
      '<td class="num tsub">'+qty(r.minimo)+'</td>'+
      '<td class="num tabular">'+money(r.custo)+'</td>'+
      '<td class="num tabular" style="font-weight:700">'+money(r.valorTotal)+'</td>'+
      '<td>'+Stock.statusBadge(r.status)+'</td></tr>';
  });
  const tot = rows.reduce((s,r)=>s+r.valorTotal,0);
  tb += '</tbody><tfoot><tr style="background:var(--gray-50)"><td colspan="7" style="text-align:right;font-weight:700;padding:12px 14px;border-top:2px solid var(--gray-200)">Total ('+rows.length+' itens)</td>'+
        '<td class="num" style="font-weight:800;padding:12px 14px;border-top:2px solid var(--gray-200)">'+money(tot)+'</td><td style="border-top:2px solid var(--gray-200)"></td></tr></tfoot></table></div>';

  el.innerHTML = cards + tb;
}

/* ---- Detalhe do material / estoque ---- */
Views.estoqueDetalhe = function(id){
  const m = DB.materiais.get(id); if(!m) return;
  const saldo = Stock.saldo(id);
  const st = Stock.status(saldo, m.estoqueMinimo);
  const custo = numRaw(m.custoMedio);
  const diretos = Stock.diretos()[id]||0;
  const movs = DB.movimentacoes.all().filter(x=>x.materialId===id)
    .sort((a,b)=>(b.data+(b.criadoEm||'')).localeCompare(a.data+(a.criadoEm||''))).slice(0,12);
  const repor = Math.max(0,(numRaw(m.estoqueIdeal)||numRaw(m.estoqueMinimo))-saldo);

  let b = '<div class="row-between" style="margin-bottom:14px">'+
    '<div><div class="item-code">'+esc(m.codigo)+'</div>'+
    '<div style="font-size:17px;font-weight:700;letter-spacing:-.3px;line-height:1.25">'+esc(m.descricao)+'</div></div>'+
    Stock.statusBadge(st)+'</div>';

  b += '<div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:6px">'+
    '<div class="kpi k-'+(st==='normal'?'green':(st==='baixo'?'amber':'red'))+'"><div class="kl">Em estoque</div><div class="kv">'+qty(saldo)+' <small>'+esc(m.unidade)+'</small></div></div>'+
    '<div class="kpi k-navy"><div class="kl">Mínimo</div><div class="kv">'+qty(m.estoqueMinimo)+' <small>'+esc(m.unidade)+'</small></div></div>'+
    '<div class="kpi k-blue"><div class="kl">Valor total</div><div class="kv" style="font-size:18px">'+money(saldo*custo)+'</div></div>'+
  '</div>';

  if(st!=='normal'){
    b += '<div class="alert a-'+(st==='baixo'?'amber':'red')+'" style="margin:12px 0"><i class="fa-solid fa-triangle-exclamation"></i>'+
      '<div><b>'+(st==='zerado'?'Estoque zerado':(st==='critico'?'Nível crítico':'Abaixo do mínimo'))+'.</b> '+
      'Sugestão de compra: <b>'+qty(repor)+' '+esc(m.unidade)+'</b> para atingir o estoque ideal.</div></div>';
  }

  b += '<div class="form-sec">Ficha do material</div><div class="kv-list">'+
    kv('Categoria', m.categoria)+ kv('Unidade', m.unidade)+
    kv('Estoque ideal', qty(m.estoqueIdeal)+' '+m.unidade)+
    kv('Custo médio', money(custo))+
    kv('Código EAN', m.ean||'—')+
    kv('Cód. fornecedor', m.codFornecedor||'—')+
    kv('Fornecedor', m.fornecedorId?nomeForn(m.fornecedorId):'—')+
    kv('Entregue direto em obra', qty(diretos)+' '+m.unidade)+
    kv('Situação', m.ativo!==false?'<span class="badge b-green">Ativo</span>':'<span class="badge b-gray">Inativo</span>')+
  '</div>';

  b += '<div class="form-sec">Últimas movimentações</div>';
  if(!movs.length) b += '<p class="muted" style="font-size:13px">Nenhuma movimentação registrada.</p>';
  else { b += '<div class="list">'; movs.forEach(x=>b+=movRow(x)); b += '</div>'; }

  Modal.open({
    title:'Detalhe do material', icon:'fa-cube', wide:true, body:b,
    footer:'<button class="btn btn-outline" onclick="Modal.close();Forms.editarMaterial(\''+id+'\')"><i class="fa-solid fa-pen"></i> Editar</button>'+
           '<button class="btn btn-green" onclick="Modal.close();Forms.novaEntrada({materialId:\''+id+'\'})"><i class="fa-solid fa-arrow-down"></i> Entrada</button>'+
           '<button class="btn btn-primary" onclick="Modal.close();Forms.novaSaida({materialId:\''+id+'\'})"><i class="fa-solid fa-arrow-up"></i> Saída</button>'
  });
};
function kv(k,v){ return '<div class="kv-row"><div class="k">'+esc(k)+'</div><div class="v">'+v+'</div></div>'; }
</script>
<script>
/* ==========================================================================
   FORMULÁRIOS DE MOVIMENTAÇÃO
   ========================================================================== */
const Forms = {};

/* -------------------- NOVA ENTRADA -------------------- */
Forms.novaEntrada = function(pre){
  pre = pre||{};
  const mats = DB.materiais.all().filter(m=>m.ativo!==false).sort((a,b)=>a.descricao.localeCompare(b.descricao,'pt-BR'));
  const forns = DB.fornecedores.all().sort((a,b)=>(a.fantasia||a.razaoSocial).localeCompare(b.fantasia||b.razaoSocial,'pt-BR'));
  const obras = DB.obras.all().filter(o=>o.status!=='concluida');

  const cart = [];
  if(pre.materialId){ const m=DB.materiais.get(pre.materialId); if(m) cart.push({materialId:m.id, desc:m.descricao, un:m.unidade, qtd:1, valor:numRaw(m.custoMedio)}); }

  let b = '';
  b += '<div class="field"><label>Destino da mercadoria <span class="req">*</span></label>'+
    '<div class="radio-row">'+
      '<button type="button" class="radio-card on" data-dest="galpao"><i class="fa-solid fa-warehouse"></i><b>Estoque Principal</b><small>Entra no galpão central</small></button>'+
      '<button type="button" class="radio-card" data-dest="obra"><i class="fa-solid fa-truck-ramp-box"></i><b>Entrega Direta na Obra</b><small>Não soma ao galpão</small></button>'+
    '</div></div>';

  b += '<div class="field hide" id="fldObra"><label>Obra de destino <span class="req">*</span></label>'+
    '<select class="input" id="enObra">'+selectOpts(obras,'id','nome','','Selecione a obra…')+'</select>'+
    '<div class="hint">O material será registrado como entrada direta e <b>não</b> aumentará o estoque do galpão.</div></div>';

  b += '<div class="grid2">'+
    '<div class="field"><label>Data <span class="req">*</span></label><input type="date" class="input" id="enData" value="'+todayISO()+'"></div>'+
    '<div class="field"><label>Número da NF</label><input type="text" class="input" id="enNF" placeholder="Ex.: 19501" inputmode="numeric"></div>'+
  '</div>';

  b += '<div class="field"><label>Fornecedor</label><select class="input" id="enForn">'+
       selectOpts(forns,'id','fantasia','','Selecione o fornecedor…')+'</select></div>';

  b += '<div class="form-sec">Materiais recebidos</div>'+
       '<div id="enCart" class="stack" style="margin-bottom:12px"></div>'+
       '<button type="button" class="btn btn-outline btn-block" id="enAdd"><i class="fa-solid fa-plus"></i> Adicionar material</button>';

  b += '<div class="field" style="margin-top:18px"><label>Observação</label>'+
       '<textarea class="input" id="enObs" placeholder="Ex.: Descarga conferida por João. Faltaram 2 sacos."></textarea></div>';

  b += '<div class="card card-pad" style="background:var(--gray-50);margin-top:6px">'+
       '<div class="row-between"><b style="font-size:13px">Total da entrada</b>'+
       '<b id="enTotal" style="font-size:19px;color:var(--green)">R$ 0,00</b></div></div>';

  Modal.open({
    title:'Nova Entrada', icon:'fa-arrow-down', wide:true, body:b,
    footer:'<button class="btn btn-outline" data-close>Cancelar</button>'+
           '<button class="btn btn-green" id="enSalvar"><i class="fa-solid fa-check"></i> Registrar entrada</button>',
    onMount:ov=>{
      let destino='galpao';
      $$('[data-dest]',ov).forEach(btn=>btn.addEventListener('click',()=>{
        destino=btn.dataset.dest;
        $$('[data-dest]',ov).forEach(x=>x.classList.toggle('on',x===btn));
        $('#fldObra',ov).classList.toggle('hide', destino!=='obra');
      }));

      function renderCart(){
        const el=$('#enCart',ov);
        if(!cart.length){ el.innerHTML='<div class="alert a-blue"><i class="fa-solid fa-circle-info"></i><div>Nenhum material adicionado ainda.</div></div>'; }
        else{
          el.innerHTML = cart.map((c,i)=>
            '<div class="card card-pad" style="padding:12px">'+
              '<div class="row-between" style="margin-bottom:9px"><div style="flex:1;min-width:0">'+
                '<b style="font-size:13.5px;display:block">'+esc(c.desc)+'</b>'+
                '<small class="muted" style="font-size:11.5px">Unidade: '+esc(c.un)+'</small></div>'+
                '<button class="icon-btn" style="background:var(--red-soft);color:var(--red);width:32px;height:32px" data-del="'+i+'"><i class="fa-solid fa-trash"></i></button></div>'+
              '<div class="grid2">'+
                '<div><label style="font-size:11px;font-weight:700;color:var(--gray-500)">Quantidade</label>'+
                  '<input type="number" class="input" style="min-height:42px" data-q="'+i+'" value="'+c.qtd+'" min="0" step="0.001" inputmode="decimal"></div>'+
                '<div><label style="font-size:11px;font-weight:700;color:var(--gray-500)">Valor unitário (R$)</label>'+
                  '<input type="number" class="input" style="min-height:42px" data-v="'+i+'" value="'+c.valor+'" min="0" step="0.01" inputmode="decimal"></div>'+
              '</div>'+
              '<div style="text-align:right;margin-top:8px;font-size:12.5px;color:var(--gray-600)">Subtotal: <b>'+money(c.qtd*c.valor)+'</b></div>'+
            '</div>').join('');
        }
        $('#enTotal',ov).textContent = money(cart.reduce((s,c)=>s+c.qtd*c.valor,0));
        $$('[data-del]',ov).forEach(x=>x.addEventListener('click',()=>{ cart.splice(+x.dataset.del,1); renderCart(); }));
        $$('[data-q]',ov).forEach(x=>x.addEventListener('input',()=>{ cart[+x.dataset.q].qtd=numRaw(x.value); 
          $('#enTotal',ov).textContent=money(cart.reduce((s,c)=>s+c.qtd*c.valor,0));
          x.closest('.card').querySelector('div[style*="text-align:right"] b').textContent=money(cart[+x.dataset.q].qtd*cart[+x.dataset.q].valor); }));
        $$('[data-v]',ov).forEach(x=>x.addEventListener('input',()=>{ cart[+x.dataset.v].valor=numRaw(x.value);
          $('#enTotal',ov).textContent=money(cart.reduce((s,c)=>s+c.qtd*c.valor,0));
          x.closest('.card').querySelector('div[style*="text-align:right"] b').textContent=money(cart[+x.dataset.v].qtd*cart[+x.dataset.v].valor); }));
      }
      renderCart();

      $('#enAdd',ov).addEventListener('click',()=>{
        Picker.material(mats, sel=>{
          if(cart.some(c=>c.materialId===sel.id)){ Toast.warn('Material já adicionado'); return; }
          cart.push({materialId:sel.id, desc:sel.descricao, un:sel.unidade, qtd:1, valor:numRaw(sel.custoMedio)});
          renderCart();
        });
      });

      $('#enSalvar',ov).addEventListener('click',()=>{
        const data=$('#enData',ov).value, nf=$('#enNF',ov).value.trim();
        const fornId=$('#enForn',ov).value, obraId=$('#enObra',ov).value, obs=$('#enObs',ov).value.trim();
        if(!data){ Toast.err('Informe a data'); return; }
        if(!cart.length){ Toast.err('Adicione ao menos um material'); return; }
        if(destino==='obra' && !obraId){ Toast.err('Selecione a obra de destino'); return; }
        if(cart.some(c=>c.qtd<=0)){ Toast.err('Quantidade inválida','Todas as quantidades devem ser maiores que zero.'); return; }

        const tipo = destino==='obra' ? 'entrada_direta' : 'entrada';
        const total = cart.reduce((s,c)=>s+c.qtd*c.valor,0);
        let nfId=null;
        if(nf){
          const cfg=DB.config.get();
          const f = fornId?DB.fornecedores.get(fornId):null;
          nfId = DB.notas.add({numero:nf, serie:'1', chave:'', emissao:data, fornecedorId:fornId||null,
            emitenteNome:f?f.razaoSocial:'', emitenteCnpj:f?String(f.cnpj).replace(/\D/g,''):'',
            destinatarioCnpj:String(cfg.cnpj).replace(/\D/g,''), valorTotal:Math.round(total*100)/100, origem:'manual',
            destino:destino, obraId:obraId||null,
            itens:cart.map(c=>({codigo:'', descricao:c.desc, qtd:c.qtd, unidade:c.un, valorUnit:c.valor, valorTotal:Math.round(c.qtd*c.valor*100)/100, materialId:c.materialId}))}).id;
        }
        cart.forEach(c=>{
          Mov.criar({tipo, data, materialId:c.materialId, materialDesc:c.desc, unidade:c.un,
            quantidade:c.qtd, valorUnitario:c.valor, valorTotal:Math.round(c.qtd*c.valor*100)/100,
            fornecedorId:fornId||null, nfNumero:nf, nfId:nfId,
            origem: fornId?nomeForn(fornId):'Fornecedor', 
            destino: destino==='obra'?nomeObra(obraId):DB.config.get().galpao,
            obraId: destino==='obra'?obraId:null, observacao:obs});
        });
        Modal.close();
        Toast.ok(destino==='obra'?'Entrada direta registrada.':'Entrada registrada com sucesso.',
                 cart.length+' material(is) · '+money(total));
        App.render();
      });
    }
  });
};

/* -------------------- NOVA SAÍDA -------------------- */
Forms.novaSaida = function(pre){
  pre = pre||{};
  const saldos = Stock.saldos();
  const mats = DB.materiais.all().filter(m=>m.ativo!==false)
    .sort((a,b)=>a.descricao.localeCompare(b.descricao,'pt-BR'));
  const obras = DB.obras.all().filter(o=>o.status==='andamento'||o.status==='planejada');

  const cart = [];
  if(pre.materialId){ const m=DB.materiais.get(pre.materialId); if(m) cart.push({materialId:m.id, desc:m.descricao, un:m.unidade, qtd:1}); }

  let b = '';
  b += '<div class="field"><label>Obra de destino <span class="req">*</span></label>'+
       '<select class="input" id="saObra">'+selectOpts(obras,'id','nome','','Selecione a obra…')+'</select></div>';
  b += '<div class="grid2">'+
    '<div class="field"><label>Data <span class="req">*</span></label><input type="date" class="input" id="saData" value="'+todayISO()+'"></div>'+
    '<div class="field"><label>Responsável</label><input type="text" class="input" id="saResp" value="'+esc(DB.config.get().usuario)+'"></div>'+
  '</div>';

  b += '<div class="form-sec">Materiais a enviar</div>'+
       '<div id="saCart" class="stack" style="margin-bottom:12px"></div>'+
       '<button type="button" class="btn btn-outline btn-block" id="saAdd"><i class="fa-solid fa-plus"></i> Adicionar material</button>';

  b += '<div class="field" style="margin-top:18px"><label>Observação</label>'+
       '<textarea class="input" id="saObs" placeholder="Ex.: Solicitado pelo mestre Jorge para concretagem da laje."></textarea></div>';

  b += '<div class="card card-pad" style="background:var(--gray-50);margin-top:6px">'+
       '<div class="row-between"><b style="font-size:13px">Valor estimado da saída</b>'+
       '<b id="saTotal" style="font-size:19px;color:var(--blue)">R$ 0,00</b></div></div>';

  Modal.open({
    title:'Nova Saída para Obra', icon:'fa-arrow-up', wide:true, body:b,
    footer:'<button class="btn btn-outline" data-close>Cancelar</button>'+
           '<button class="btn btn-primary" id="saSalvar"><i class="fa-solid fa-check"></i> Confirmar saída</button>',
    onMount:ov=>{
      function renderCart(){
        const el=$('#saCart',ov);
        if(!cart.length){ el.innerHTML='<div class="alert a-blue"><i class="fa-solid fa-circle-info"></i><div>Selecione os materiais que serão enviados para a obra.</div></div>'; }
        else{
          el.innerHTML = cart.map((c,i)=>{
            const disp = saldos[c.materialId]||0;
            const excede = c.qtd>disp;
            const mat = DB.materiais.get(c.materialId);
            return '<div class="card card-pad" style="padding:12px'+(excede?';border-color:var(--red);background:#fffafa':'')+'">'+
              '<div class="row-between" style="margin-bottom:9px"><div style="flex:1;min-width:0">'+
                '<b style="font-size:13.5px;display:block">'+esc(c.desc)+'</b>'+
                '<small class="muted" style="font-size:11.5px">Disponível: <b style="color:'+(excede?'var(--red)':'var(--green)')+'">'+qty(disp)+' '+esc(c.un)+'</b></small></div>'+
                '<button class="icon-btn" style="background:var(--red-soft);color:var(--red);width:32px;height:32px" data-del="'+i+'"><i class="fa-solid fa-trash"></i></button></div>'+
              '<div class="row-between">'+
                '<div class="qty-ctl"><button type="button" data-minus="'+i+'"><i class="fa-solid fa-minus"></i></button>'+
                  '<input type="number" data-q="'+i+'" value="'+c.qtd+'" min="0" step="0.001" inputmode="decimal">'+
                  '<button type="button" data-plus="'+i+'"><i class="fa-solid fa-plus"></i></button></div>'+
                '<div style="text-align:right"><div style="font-size:11px;color:var(--gray-400);font-weight:700">'+esc(c.un)+'</div>'+
                '<div style="font-size:12.5px;font-weight:700">'+money(c.qtd*numRaw(mat?mat.custoMedio:0))+'</div></div>'+
              '</div>'+
              (excede?'<div class="alert a-red" style="margin-top:9px;padding:9px 11px"><i class="fa-solid fa-circle-exclamation"></i><div><b>Estoque insuficiente.</b> Disponível: '+qty(disp)+' '+esc(c.un)+'</div></div>':'')+
            '</div>';
          }).join('');
        }
        const tot = cart.reduce((s,c)=>{ const m=DB.materiais.get(c.materialId); return s+c.qtd*numRaw(m?m.custoMedio:0); },0);
        $('#saTotal',ov).textContent = money(tot);
        $$('[data-del]',ov).forEach(x=>x.addEventListener('click',()=>{ cart.splice(+x.dataset.del,1); renderCart(); }));
        $$('[data-q]',ov).forEach(x=>x.addEventListener('change',()=>{ cart[+x.dataset.q].qtd=Math.max(0,numRaw(x.value)); renderCart(); }));
        $$('[data-minus]',ov).forEach(x=>x.addEventListener('click',()=>{ const i=+x.dataset.minus; cart[i].qtd=Math.max(0,Math.round((cart[i].qtd-1)*1000)/1000); renderCart(); }));
        $$('[data-plus]',ov).forEach(x=>x.addEventListener('click',()=>{ const i=+x.dataset.plus; cart[i].qtd=Math.round((cart[i].qtd+1)*1000)/1000; renderCart(); }));
      }
      renderCart();

      $('#saAdd',ov).addEventListener('click',()=>{
        Picker.material(mats, sel=>{
          if(cart.some(c=>c.materialId===sel.id)){ Toast.warn('Material já adicionado'); return; }
          cart.push({materialId:sel.id, desc:sel.descricao, un:sel.unidade, qtd:1});
          renderCart();
        }, {saldos:saldos, soComSaldo:true});
      });

      $('#saSalvar',ov).addEventListener('click',()=>{
        const obraId=$('#saObra',ov).value, data=$('#saData',ov).value;
        const resp=$('#saResp',ov).value.trim()||DB.config.get().usuario, obs=$('#saObs',ov).value.trim();
        if(!obraId){ Toast.err('Selecione a obra de destino'); return; }
        if(!data){ Toast.err('Informe a data'); return; }
        if(!cart.length){ Toast.err('Adicione ao menos um material'); return; }

        /* VALIDAÇÃO — regra 16 */
        for(const c of cart){
          const v = Mov.validarSaida(c.materialId, c.qtd);
          if(!v.ok){
            Toast.err(v.msg, v.msg==='Estoque insuficiente.' ? (c.desc+' — Disponível: '+qty(v.disponivel)+' '+c.un) : c.desc);
            return;
          }
        }

        cart.forEach(c=>{
          const mat = DB.materiais.get(c.materialId);
          const custo = numRaw(mat.custoMedio);
          Mov.criar({tipo:'saida', data, materialId:c.materialId, materialDesc:c.desc, unidade:c.un,
            quantidade:c.qtd, valorUnitario:custo, valorTotal:Math.round(c.qtd*custo*100)/100,
            fornecedorId:null, nfNumero:'', nfId:null, responsavel:resp,
            origem:DB.config.get().galpao, destino:nomeObra(obraId), obraId, observacao:obs});
        });
        Modal.close();
        Toast.ok('Saída registrada com sucesso.', cart.length+' material(is) enviados para '+nomeObra(obraId));
        App.render();
      });
    }
  });
};

/* -------------------- DEVOLUÇÃO DA OBRA PARA O GALPÃO -------------------- */
Forms.novaDevolucao = function(pre){
  pre = pre||{};
  const obras = DB.obras.all();
  if(!obras.length){ Toast.err('Cadastre uma obra antes de registrar devolução'); return; }
  let cart = [];
  let obraSel = pre.obraId || '';

  let b = '<div class="alert a-green" style="margin-bottom:16px"><i class="fa-solid fa-rotate-left"></i>'+
    '<div>Material que sobrou na obra e <b>voltou para o galpão</b>. O saldo do estoque principal é recomposto.</div></div>';

  b += '<div class="grid2">'+
    '<div class="field"><label>Obra de origem <span class="req">*</span></label>'+
      '<select class="input" id="dvObra"><option value="">Selecione…</option>'+
      obras.map(o=>'<option value="'+o.id+'"'+(o.id===obraSel?' selected':'')+'>'+esc(o.nome)+'</option>').join('')+
      '</select></div>'+
    '<div class="field"><label>Data <span class="req">*</span></label>'+
      '<input type="date" class="input" id="dvData" value="'+todayISO()+'"></div>'+
  '</div>';

  b += '<div class="field"><label>Recebido por</label>'+
       '<input class="input" id="dvResp" value="'+esc(DB.config.get().usuario||'')+'" placeholder="Quem recebeu no galpão"></div>';

  b += '<div class="form-sec">Materiais devolvidos</div>';
  b += '<div id="dvCart" class="stack" style="margin-bottom:12px"></div>';
  b += '<button type="button" class="btn btn-outline btn-block" id="dvAdd"><i class="fa-solid fa-plus"></i> Adicionar material</button>';

  b += '<div class="field" style="margin-top:18px"><label>Motivo da devolução <span class="req">*</span></label>'+
       '<textarea class="input" id="dvObs" placeholder="Ex.: Sobra da concretagem da laje. Material em bom estado."></textarea></div>';

  b += '<div class="card card-pad" style="background:var(--gray-50);margin-top:6px">'+
       '<div class="row-between"><b style="font-size:13px">Valor retornado ao estoque</b>'+
       '<b id="dvTotal" style="font-size:19px;color:var(--green)">R$ 0,00</b></div></div>';

  Modal.open({
    title:'Devolução de Material', icon:'fa-rotate-left', wide:true, body:b,
    footer:'<button class="btn btn-outline" data-close>Cancelar</button>'+
           '<button class="btn btn-green" id="dvSalvar"><i class="fa-solid fa-check"></i> Confirmar devolução</button>',
    onMount:ov=>{
      function pend(){ return obraSel ? Mov.pendentesObra(obraSel) : []; }

      function renderCart(){
        const el=$('#dvCart',ov), lista=pend();
        if(!obraSel){
          el.innerHTML='<div class="alert a-blue"><i class="fa-solid fa-circle-info"></i><div>Selecione a obra de origem para ver o que pode ser devolvido.</div></div>';
        } else if(!lista.length){
          el.innerHTML='<div class="alert a-amber"><i class="fa-solid fa-triangle-exclamation"></i><div>Esta obra não tem material pendente de devolução. Só é possível devolver o que saiu do galpão para ela.</div></div>';
        } else if(!cart.length){
          el.innerHTML='<div class="alert a-blue"><i class="fa-solid fa-circle-info"></i><div>Adicione os materiais que retornaram ao galpão.</div></div>';
        } else {
          el.innerHTML = cart.map((c,i)=>{
            const r = lista.find(x=>x.materialId===c.materialId);
            const max = r?r.pendente:0;
            const excede = c.qtd>max;
            return '<div class="card card-pad" style="padding:12px'+(excede?';border-color:var(--red);background:#fffafa':'')+'">'+
              '<div class="row-between" style="margin-bottom:9px"><div style="flex:1;min-width:0">'+
                '<b style="font-size:13.5px;display:block">'+esc(c.desc)+'</b>'+
                '<small class="muted" style="font-size:11.5px">Na obra: <b style="color:'+(excede?'var(--red)':'var(--green)')+'">'+qty(max)+' '+esc(c.un)+'</b></small></div>'+
                '<button class="icon-btn" style="background:var(--red-soft);color:var(--red);width:32px;height:32px" data-del="'+i+'"><i class="fa-solid fa-trash"></i></button></div>'+
              '<div class="row-between">'+
                '<div class="qty-ctl"><button type="button" data-minus="'+i+'"><i class="fa-solid fa-minus"></i></button>'+
                  '<input type="number" data-q="'+i+'" value="'+c.qtd+'" min="0" step="0.001" inputmode="decimal">'+
                  '<button type="button" data-plus="'+i+'"><i class="fa-solid fa-plus"></i></button></div>'+
                '<div style="text-align:right"><div style="font-size:11px;color:var(--gray-400);font-weight:700">'+esc(c.un)+'</div>'+
                '<div style="font-size:12.5px;font-weight:700">'+money(c.qtd*c.custo)+'</div></div>'+
              '</div>'+
              '<button type="button" class="btn btn-outline btn-sm btn-block" style="margin-top:9px" data-all="'+i+'">'+
                '<i class="fa-solid fa-arrows-rotate"></i> Devolver tudo ('+qty(max)+' '+esc(c.un)+')</button>'+
              (excede?'<div class="alert a-red" style="margin-top:9px;padding:9px 11px"><i class="fa-solid fa-circle-exclamation"></i><div><b>Devolução maior que o enviado.</b> A obra recebeu '+qty(max)+' '+esc(c.un)+'.</div></div>':'')+
            '</div>';
          }).join('');
        }
        $('#dvTotal',ov).textContent = money(cart.reduce((s,c)=>s+c.qtd*c.custo,0));
        $$('[data-del]',ov).forEach(x=>x.addEventListener('click',()=>{ cart.splice(+x.dataset.del,1); renderCart(); }));
        $$('[data-q]',ov).forEach(x=>x.addEventListener('change',()=>{ cart[+x.dataset.q].qtd=Math.max(0,numRaw(x.value)); renderCart(); }));
        $$('[data-minus]',ov).forEach(x=>x.addEventListener('click',()=>{ const i=+x.dataset.minus; cart[i].qtd=Math.max(0,Math.round((cart[i].qtd-1)*1000)/1000); renderCart(); }));
        $$('[data-plus]',ov).forEach(x=>x.addEventListener('click',()=>{ const i=+x.dataset.plus; const r=pend().find(y=>y.materialId===cart[i].materialId);
          cart[i].qtd=Math.min(r?r.pendente:cart[i].qtd+1, Math.round((cart[i].qtd+1)*1000)/1000); renderCart(); }));
        $$('[data-all]',ov).forEach(x=>x.addEventListener('click',()=>{ const i=+x.dataset.all; const r=pend().find(y=>y.materialId===cart[i].materialId);
          if(r) cart[i].qtd=r.pendente; renderCart(); }));
      }
      renderCart();

      $('#dvObra',ov).addEventListener('change',e=>{ obraSel=e.target.value; cart=[]; renderCart(); });

      $('#dvAdd',ov).addEventListener('click',()=>{
        if(!obraSel){ Toast.err('Selecione a obra de origem primeiro'); return; }
        const lista = pend().filter(r=>!cart.some(c=>c.materialId===r.materialId));
        if(!lista.length){ Toast.warn('Nenhum material disponível para devolução'); return; }
        /* lista enxuta: só o que a obra realmente tem em aberto */
        const body = '<div class="list">'+lista.map(r=>
          '<div class="pick-item" data-p="'+r.materialId+'" style="padding:13px">'+
            '<div class="mv-icon mv-ret"><i class="fa-solid fa-rotate-left"></i></div>'+
            '<div class="pi-main"><b style="font-size:13.5px">'+esc(r.desc)+'</b>'+
            '<small>Na obra: '+qty(r.pendente)+' '+esc(r.un)+' · '+money(r.custo)+'/'+esc(r.un)+'</small></div>'+
            '<i class="fa-solid fa-chevron-right" style="color:var(--gray-300);font-size:12px"></i></div>').join('')+'</div>';
        Modal.open({title:'Material devolvido', icon:'fa-boxes-stacked', body:body,
          footer:'<button class="btn btn-outline btn-block" data-close>Cancelar</button>',
          onMount:ov2=>$$('[data-p]',ov2).forEach(x=>x.addEventListener('click',()=>{
            const r = lista.find(y=>y.materialId===x.dataset.p);
            cart.push({materialId:r.materialId, desc:r.desc, un:r.un, qtd:r.pendente, custo:r.custo});
            Modal.close(); renderCart();
          }))});
      });

      $('#dvSalvar',ov).addEventListener('click',()=>{
        const data=$('#dvData',ov).value;
        const resp=$('#dvResp',ov).value.trim()||DB.config.get().usuario;
        const obs=$('#dvObs',ov).value.trim();
        if(!obraSel){ Toast.err('Selecione a obra de origem'); return; }
        if(!data){ Toast.err('Informe a data'); return; }
        if(!cart.length){ Toast.err('Adicione ao menos um material'); return; }
        if(!obs){ Toast.err('Informe o motivo da devolução'); return; }

        for(const c of cart){
          const v = Mov.validarDevolucao(obraSel, c.materialId, c.qtd);
          if(!v.ok){
            Toast.err(v.msg, c.desc+' — Na obra: '+qty(v.pendente)+' '+c.un);
            return;
          }
        }

        cart.forEach(c=>{
          Mov.criar({tipo:'devolucao', data, materialId:c.materialId, materialDesc:c.desc, unidade:c.un,
            quantidade:c.qtd, valorUnitario:c.custo, valorTotal:Math.round(c.qtd*c.custo*100)/100,
            fornecedorId:null, nfNumero:'', nfId:null, responsavel:resp,
            origem:nomeObra(obraSel), destino:DB.config.get().galpao, obraId:obraSel, observacao:obs});
        });
        Modal.close();
        Toast.ok('Devolução registrada com sucesso.', cart.length+' material(is) retornaram de '+nomeObra(obraSel));
        App.render();
      });
    }
  });
};

/* -------------------- AJUSTE DE INVENTÁRIO -------------------- */
Forms.novoAjuste = function(pre){
  pre = pre||{};
  const mats = DB.materiais.all().filter(m=>m.ativo!==false).sort((a,b)=>a.descricao.localeCompare(b.descricao,'pt-BR'));
  let sel = pre.materialId ? DB.materiais.get(pre.materialId) : null;

  let b = '<div class="alert a-amber" style="margin-bottom:16px"><i class="fa-solid fa-scale-balanced"></i>'+
    '<div>Use o ajuste para corrigir divergências entre o sistema e a contagem física do galpão.</div></div>';
  b += '<div class="field"><label>Material <span class="req">*</span></label>'+
       '<button type="button" class="input" id="ajPick" style="text-align:left;color:'+(sel?'var(--gray-900)':'var(--gray-400)')+'">'+
       (sel?esc(sel.descricao):'Toque para selecionar…')+'</button></div>';
  b += '<div id="ajInfo"></div>';
  b += '<div class="grid2">'+
    '<div class="field"><label>Nova quantidade contada <span class="req">*</span></label>'+
      '<input type="number" class="input" id="ajQtd" step="0.001" min="0" inputmode="decimal" placeholder="0"></div>'+
    '<div class="field"><label>Data</label><input type="date" class="input" id="ajData" value="'+todayISO()+'"></div>'+
  '</div>';
  b += '<div id="ajDiff"></div>';
  b += '<div class="field"><label>Motivo / observação <span class="req">*</span></label>'+
       '<textarea class="input" id="ajObs" placeholder="Ex.: Contagem de inventário mensal. Perda por avaria."></textarea></div>';

  Modal.open({
    title:'Ajuste de Inventário', icon:'fa-scale-balanced', body:b,
    footer:'<button class="btn btn-outline" data-close>Cancelar</button>'+
           '<button class="btn btn-amber" id="ajSalvar"><i class="fa-solid fa-check"></i> Aplicar ajuste</button>',
    onMount:ov=>{
      function info(){
        if(!sel){ $('#ajInfo',ov).innerHTML=''; return; }
        const s = Stock.saldo(sel.id);
        $('#ajInfo',ov).innerHTML='<div class="alert a-blue" style="margin-bottom:14px"><i class="fa-solid fa-boxes-stacked"></i>'+
          '<div>Saldo atual no sistema: <b>'+qty(s)+' '+esc(sel.unidade)+'</b></div></div>';
        diff();
      }
      function diff(){
        const q=$('#ajQtd',ov).value;
        if(!sel || q===''){ $('#ajDiff',ov).innerHTML=''; return; }
        const atual=Stock.saldo(sel.id), nova=numRaw(q), d=Math.round((nova-atual)*1000)/1000;
        $('#ajDiff',ov).innerHTML = '<div class="alert a-'+(d===0?'blue':(d>0?'green':'red'))+'" style="margin-bottom:16px">'+
          '<i class="fa-solid fa-'+(d===0?'equals':(d>0?'arrow-up':'arrow-down'))+'"></i><div>Diferença: <b>'+(d>0?'+':'')+qty(d)+' '+esc(sel.unidade)+'</b>'+
          (d===0?' — nenhum ajuste necessário.':'')+'</div></div>';
      }
      $('#ajPick',ov).addEventListener('click',()=>Picker.material(mats, m=>{
        sel=m; $('#ajPick',ov).textContent=m.descricao; $('#ajPick',ov).style.color='var(--gray-900)'; info();
      }));
      $('#ajQtd',ov).addEventListener('input',diff);
      info();
      $('#ajSalvar',ov).addEventListener('click',()=>{
        if(!sel){ Toast.err('Selecione o material'); return; }
        const q=$('#ajQtd',ov).value;
        if(q===''){ Toast.err('Informe a quantidade contada'); return; }
        const obs=$('#ajObs',ov).value.trim();
        if(!obs){ Toast.err('Informe o motivo do ajuste'); return; }
        const atual=Stock.saldo(sel.id), nova=numRaw(q), d=Math.round((nova-atual)*1000)/1000;
        if(d===0){ Toast.warn('Nenhuma diferença','O saldo já está correto.'); return; }
        Mov.criar({tipo:'ajuste', data:$('#ajData',ov).value||todayISO(), materialId:sel.id, materialDesc:sel.descricao,
          unidade:sel.unidade, quantidade:d, valorUnitario:numRaw(sel.custoMedio), valorTotal:0,
          origem:'Inventário', destino:DB.config.get().galpao, obraId:null, observacao:obs});
        Modal.close();
        Toast.ok('Ajuste aplicado.', sel.descricao+' → '+qty(nova)+' '+sel.unidade);
        App.render();
      });
    }
  });
};

/* -------------------- PICKER DE MATERIAL -------------------- */
const Picker = {
  material(list, onPick, opts){
    opts = opts||{};
    const saldos = opts.saldos || Stock.saldos();
    let b = '<div class="searchbar" style="margin-bottom:12px"><i class="fa-solid fa-magnifying-glass"></i>'+
            '<input type="search" id="pkQ" placeholder="Buscar material…" autocomplete="off"></div>'+
            '<div class="pick" id="pkList" style="max-height:52vh"></div>';
    Modal.open({
      title:'Selecionar material', icon:'fa-cube', body:b,
      footer:'<button class="btn btn-outline btn-block" data-close>Fechar</button>',
      onMount:ov=>{
        function draw(q){
          q=(q||'').toLowerCase().trim();
          let arr = list.filter(m=>!q || (m.descricao+' '+m.codigo+' '+m.categoria+' '+(m.ean||'')).toLowerCase().includes(q));
          if(!arr.length){ $('#pkList',ov).innerHTML='<div class="empty" style="padding:26px"><i class="fa-solid fa-magnifying-glass"></i><b>Nada encontrado</b></div>'; return; }
          $('#pkList',ov).innerHTML = arr.slice(0,120).map(m=>{
            const s = saldos[m.id]||0;
            const st = Stock.status(s, m.estoqueMinimo);
            const col = s<=0?'var(--red)':(st==='normal'?'var(--green)':'var(--amber)');
            return '<div class="pick-item" data-id="'+m.id+'">'+
              '<div class="pi-main"><b>'+esc(m.descricao)+'</b><small>'+esc(m.codigo)+' · '+esc(m.categoria)+'</small></div>'+
              '<div style="text-align:right;flex-shrink:0"><div style="font-weight:800;font-size:13.5px;color:'+col+'">'+qty(s)+'</div>'+
              '<div style="font-size:10px;color:var(--gray-400);font-weight:700">'+esc(m.unidade)+'</div></div></div>';
          }).join('');
          $$('.pick-item',ov).forEach(it=>it.addEventListener('click',()=>{
            const m = list.find(x=>x.id===it.dataset.id);
            Modal.close(); onPick(m);
          }));
        }
        draw('');
        const q=$('#pkQ',ov); q.addEventListener('input',debounce(()=>draw(q.value),120));
        setTimeout(()=>{ if(window.innerWidth>900) q.focus(); },120);
      }
    });
  }
};
</script>
<script>
/* ==========================================================================
   VIEW: MOVIMENTAÇÕES
   ========================================================================== */
Views.movimentacoes = function(){
  const f = App.state.movFiltros;
  const obras = DB.obras.all(), forns = DB.fornecedores.all(), mats = DB.materiais.all().sort((a,b)=>a.descricao.localeCompare(b.descricao,'pt-BR'));

  let h = pageHead('fa-right-left','Movimentações','Histórico completo de entradas, saídas e ajustes',
    '<button class="btn btn-outline btn-sm" onclick="Reports.exportMovCSV()"><i class="fa-solid fa-file-csv"></i> Exportar</button>'+
    '<button class="btn btn-green btn-sm" onclick="Forms.novaEntrada()"><i class="fa-solid fa-arrow-down"></i> Entrada</button>'+
    '<button class="btn btn-primary btn-sm" onclick="Forms.novaSaida()"><i class="fa-solid fa-arrow-up"></i> Saída</button>');

  h += '<div class="card card-pad" style="margin-bottom:14px">'+
    '<div class="grid3">'+
      '<div class="field" style="margin:0"><label>Período</label><select class="input" id="mfPeriodo">'+
        opt('7','Últimos 7 dias',f.periodo)+opt('30','Últimos 30 dias',f.periodo)+opt('90','Últimos 90 dias',f.periodo)+
        opt('mes','Mês atual',f.periodo)+opt('todos','Todo o histórico',f.periodo)+opt('custom','Personalizado…',f.periodo)+
      '</select></div>'+
      '<div class="field" style="margin:0"><label>Tipo</label><select class="input" id="mfTipo">'+
        '<option value="">Todos os tipos</option>'+
        opt('entrada','Entrada no estoque',f.tipo)+opt('saida','Saída para obra',f.tipo)+
        opt('entrada_direta','Entrada direta na obra',f.tipo)+opt('devolucao','Devolução da obra',f.tipo)+opt('ajuste','Ajuste de inventário',f.tipo)+
      '</select></div>'+
      '<div class="field" style="margin:0"><label>Obra</label><select class="input" id="mfObra">'+
        '<option value="">Todas as obras</option>'+selectOpts(obras,'id','nome',f.obraId,false)+'</select></div>'+
    '</div>'+
    '<div class="grid3" id="mfCustom" style="margin-top:12px'+(f.periodo==='custom'?'':';display:none')+'">'+
      '<div class="field" style="margin:0"><label>De</label><input type="date" class="input" id="mfDe" value="'+esc(f.de)+'"></div>'+
      '<div class="field" style="margin:0"><label>Até</label><input type="date" class="input" id="mfAte" value="'+esc(f.ate)+'"></div>'+
      '<div></div>'+
    '</div>'+
    '<div class="grid3" style="margin-top:12px">'+
      '<div class="field" style="margin:0"><label>Material</label><select class="input" id="mfMat">'+
        '<option value="">Todos os materiais</option>'+selectOpts(mats,'id','descricao',f.materialId,false)+'</select></div>'+
      '<div class="field" style="margin:0"><label>Fornecedor</label><select class="input" id="mfForn">'+
        '<option value="">Todos os fornecedores</option>'+selectOpts(forns,'id','fantasia',f.fornecedorId,false)+'</select></div>'+
      '<div class="field" style="margin:0;display:flex;align-items:flex-end"><button class="btn btn-outline btn-block" id="mfLimpar"><i class="fa-solid fa-eraser"></i> Limpar filtros</button></div>'+
    '</div>'+
  '</div>';

  h += '<div id="movResumo"></div><div id="movLista"></div>';
  return h;
};
function opt(v,l,cur){ return '<option value="'+v+'"'+(String(cur)===String(v)?' selected':'')+'>'+esc(l)+'</option>'; }

Views.movimentacoes_init = function(){
  const f = App.state.movFiltros;
  const bind = (id,key)=>{ const el=$(id); if(el) el.addEventListener('change',()=>{
    f[key]=el.value;
    if(key==='periodo') $('#mfCustom').style.display = el.value==='custom'?'':'none';
    renderMovs(); }); };
  bind('#mfPeriodo','periodo'); bind('#mfTipo','tipo'); bind('#mfObra','obraId');
  bind('#mfMat','materialId'); bind('#mfForn','fornecedorId'); bind('#mfDe','de'); bind('#mfAte','ate');
  $('#mfLimpar').addEventListener('click',()=>{
    App.state.movFiltros={periodo:'30',tipo:'',obraId:'',materialId:'',fornecedorId:'',de:'',ate:''};
    App.render(); Toast.info('Filtros limpos');
  });
  renderMovs();
};
function filtraMovs(){
  const f = App.state.movFiltros;
  let de='', ate='';
  if(f.periodo==='7') de=daysAgo(7);
  else if(f.periodo==='30') de=daysAgo(30);
  else if(f.periodo==='90') de=daysAgo(90);
  else if(f.periodo==='mes') de=curMonth()+'-01';
  else if(f.periodo==='custom'){ de=f.de; ate=f.ate; }
  return DB.movimentacoes.all().filter(m=>{
    if(de && m.data<de) return false;
    if(ate && m.data>ate) return false;
    if(f.tipo && m.tipo!==f.tipo) return false;
    if(f.obraId && m.obraId!==f.obraId) return false;
    if(f.materialId && m.materialId!==f.materialId) return false;
    if(f.fornecedorId && m.fornecedorId!==f.fornecedorId) return false;
    return true;
  }).sort((a,b)=>(b.data+(b.criadoEm||'')).localeCompare(a.data+(a.criadoEm||'')));
}
function renderMovs(){
  const rows = filtraMovs();
  const ent = rows.filter(m=>m.tipo==='entrada'), sai = rows.filter(m=>m.tipo==='saida'),
        dir = rows.filter(m=>m.tipo==='entrada_direta'), aju = rows.filter(m=>m.tipo==='ajuste'),
        dev = rows.filter(m=>m.tipo==='devolucao');

  $('#movResumo').innerHTML = '<div class="kpi-grid" style="grid-template-columns:repeat(2,1fr)">'+
    kpi('green','fa-arrow-down','Entradas', String(ent.length), money(ent.reduce((s,m)=>s+numRaw(m.valorTotal),0)))+
    kpi('blue','fa-arrow-up','Saídas', String(sai.length), money(sai.reduce((s,m)=>s+numRaw(m.valorTotal),0)))+
    kpi('blue','fa-truck-ramp-box','Entrega direta', String(dir.length), money(dir.reduce((s,m)=>s+numRaw(m.valorTotal),0)))+
    kpi('green','fa-rotate-left','Devoluções', String(dev.length), money(dev.reduce((s,m)=>s+numRaw(m.valorTotal),0)))+
    kpi('amber','fa-scale-balanced','Ajustes', String(aju.length), 'Correções de inventário')+
  '</div>';

  const el = $('#movLista');
  if(!rows.length){ el.innerHTML='<div class="card">'+emptyState('fa-filter-circle-xmark','Nenhuma movimentação','Nenhum registro para os filtros selecionados.')+'</div>'; return; }

  let cards = '<div class="list as-table">';
  rows.forEach(m=>cards += movRowFull(m));
  cards += '</div>';

  let tb = '<div class="card table-wrap"><table class="compact"><thead><tr>'+
    '<th style="width:88px">Data</th><th style="width:150px">Tipo</th><th style="min-width:230px">Material</th>'+
    '<th class="num" style="width:92px">Qtd.</th><th style="width:120px">Origem</th><th style="width:150px">Destino</th>'+
    '<th style="width:140px">Fornecedor</th><th style="width:70px">NF</th>'+
    '<th class="num" style="width:104px">Valor</th><th style="width:120px">Responsável</th></tr></thead><tbody>';
  rows.forEach(m=>{
    const t=MovTipo[m.tipo]||{};
    const neg = m.tipo==='saida' || (m.tipo==='ajuste'&&numRaw(m.quantidade)<0);
    tb += '<tr onclick="Views.movDetalhe(\''+m.id+'\')">'+
      '<td class="tabular tsub nw">'+fmtDate(m.data)+'</td>'+
      '<td class="nw">'+movBadge(m.tipo)+'</td>'+
      '<td><div class="tm">'+esc(m.materialDesc||nomeMat(m.materialId))+'</div>'+(m.observacao?'<div class="tsub" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px">'+esc(m.observacao)+'</div>':'')+'</td>'+
      '<td class="num nw" style="font-weight:800;color:'+(neg?'var(--blue)':'var(--green)')+'">'+(neg?'−':'+')+qty(Math.abs(numRaw(m.quantidade)))+' <span class="tsub">'+esc(m.unidade||'')+'</span></td>'+
      '<td class="tsub nw">'+esc(m.origem||'—')+'</td>'+
      '<td class="nw">'+esc(m.destino||'—')+'</td>'+
      '<td class="tsub nw">'+(m.fornecedorId?esc(nomeForn(m.fornecedorId)):'—')+'</td>'+
      '<td class="tsub tabular nw">'+(m.nfNumero?esc(m.nfNumero):'—')+'</td>'+
      '<td class="num tabular nw">'+(numRaw(m.valorTotal)?money(m.valorTotal):'—')+'</td>'+
      '<td class="tsub nw">'+esc(m.responsavel||'—')+'</td></tr>';
  });
  tb += '</tbody></table></div>';
  el.innerHTML = cards + tb;
}
function movRowFull(m){
  const t = MovTipo[m.tipo]||MovTipo.entrada;
  const neg = m.tipo==='saida' || (m.tipo==='ajuste'&&numRaw(m.quantidade)<0);
  return '<div class="item" onclick="Views.movDetalhe(\''+m.id+'\')">'+
    '<div class="item-top">'+
      '<div class="mv-icon '+t.cls+'"><i class="fa-solid '+t.icon+'"></i></div>'+
      '<div style="flex:1;min-width:0">'+
        '<div class="item-title" style="font-size:13.5px">'+esc(m.materialDesc||nomeMat(m.materialId))+'</div>'+
        '<div style="font-size:11.5px;color:var(--gray-500);margin-top:3px">'+esc(t.label)+'</div>'+
      '</div>'+
      '<div style="text-align:right;flex-shrink:0">'+
        '<div style="font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;color:'+(neg?'var(--blue)':'var(--green)')+'">'+(neg?'−':'+')+qty(Math.abs(numRaw(m.quantidade)))+'</div>'+
        '<div style="font-size:10.5px;color:var(--gray-400);font-weight:700">'+esc(m.unidade||'')+'</div></div>'+
    '</div>'+
    '<div class="item-foot" style="font-size:11.5px;color:var(--gray-500);flex-wrap:wrap;gap:6px 12px">'+
      '<span><i class="fa-regular fa-calendar"></i> '+fmtDate(m.data)+'</span>'+
      (m.destino?'<span><i class="fa-solid fa-location-dot"></i> '+esc(m.destino)+'</span>':'')+
      (m.nfNumero?'<span><i class="fa-solid fa-file-invoice"></i> NF '+esc(m.nfNumero)+'</span>':'')+
      (numRaw(m.valorTotal)?'<span style="margin-left:auto;font-weight:700;color:var(--gray-700)">'+money(m.valorTotal)+'</span>':'')+
    '</div></div>';
}

/* ---- Detalhe da movimentação ---- */
Views.movDetalhe = function(id){
  const m = DB.movimentacoes.get(id); if(!m) return;
  const t = MovTipo[m.tipo]||{};
  const nf = m.nfId?DB.notas.get(m.nfId):null;
  const neg = m.tipo==='saida' || (m.tipo==='ajuste'&&numRaw(m.quantidade)<0);

  let b = '<div style="text-align:center;padding:6px 0 18px">'+
    '<div class="mv-icon '+t.cls+'" style="width:56px;height:56px;font-size:22px;margin:0 auto 12px;border-radius:16px"><i class="fa-solid '+t.icon+'"></i></div>'+
    movBadge(m.tipo)+
    '<div style="font-size:30px;font-weight:800;letter-spacing:-1px;margin-top:12px;color:'+(neg?'var(--blue)':'var(--green)')+'">'+
      (neg?'−':'+')+qty(Math.abs(numRaw(m.quantidade)))+' <span style="font-size:16px;color:var(--gray-400)">'+esc(m.unidade||'')+'</span></div>'+
    '<div style="font-size:14.5px;font-weight:600;margin-top:4px">'+esc(m.materialDesc||nomeMat(m.materialId))+'</div>'+
  '</div>';

  b += '<div class="kv-list">'+
    kv('Data', fmtDate(m.data))+
    kv('Registrado em', fmtDateTime(m.criadoEm))+
    kv('Material', esc(m.materialDesc||nomeMat(m.materialId)))+
    kv('Quantidade', qty(Math.abs(numRaw(m.quantidade)))+' '+esc(m.unidade||''))+
    kv('Origem', esc(m.origem||'—'))+
    kv('Destino', esc(m.destino||'—'))+
    (m.obraId?kv('Obra', esc(nomeObra(m.obraId))):'')+
    (m.fornecedorId?kv('Fornecedor', esc(nomeForn(m.fornecedorId))):'')+
    (m.nfNumero?kv('Nota fiscal', 'Nº '+esc(m.nfNumero)):'')+
    (numRaw(m.valorUnitario)?kv('Valor unitário', money(m.valorUnitario)):'')+
    (numRaw(m.valorTotal)?kv('Valor total', '<b>'+money(m.valorTotal)+'</b>'):'')+
    kv('Responsável', esc(m.responsavel||'—'))+
  '</div>';

  if(m.observacao){
    b += '<div class="form-sec">Observação</div><div class="alert a-blue"><i class="fa-solid fa-comment"></i><div>'+esc(m.observacao)+'</div></div>';
  }
  if(nf){
    b += '<div class="form-sec">Nota fiscal vinculada</div>'+
      '<div class="item" onclick="Modal.close();Views.nfDetalhe(\''+nf.id+'\')">'+
      '<div class="item-top"><div class="mv-icon mv-in" style="background:var(--blue-soft);color:var(--blue)"><i class="fa-solid fa-file-invoice-dollar"></i></div>'+
      '<div style="flex:1"><div class="item-title" style="font-size:13.5px">NF-e nº '+esc(nf.numero)+' — série '+esc(nf.serie||'1')+'</div>'+
      '<div style="font-size:11.5px;color:var(--gray-500);margin-top:2px">'+esc(nf.emitenteNome||'—')+' · '+fmtDate(nf.emissao)+'</div></div>'+
      '<i class="fa-solid fa-chevron-right" style="color:var(--gray-300)"></i></div></div>';
  }
  if(m.tipo==='devolucao'){
    b += '<div class="alert a-green" style="margin-top:14px"><i class="fa-solid fa-rotate-left"></i><div>'+
      '<b>Devolução da obra.</b> Material retornado ao galpão. O saldo do estoque principal foi recomposto e o total enviado para a obra foi reduzido na mesma medida.</div></div>';
  }
  if(m.tipo==='entrada_direta'){
    b += '<div class="alert a-blue" style="margin-top:14px"><i class="fa-solid fa-circle-info"></i><div>'+
      '<b>Entrega direta na obra.</b> Este material não passou pelo galpão e <b>não</b> compõe o estoque principal.</div></div>';
  }

  Modal.open({
    title:'Detalhe da movimentação', icon:'fa-receipt', body:b,
    footer:'<button class="btn btn-outline" data-close>Fechar</button>'+
           '<button class="btn btn-red" id="mdEstorno"><i class="fa-solid fa-rotate-left"></i> Estornar</button>',
    onMount:ov=>{
      $('#mdEstorno',ov).addEventListener('click',()=>{
        Modal.close();
        Modal.confirm('Estornar movimentação?',
          'Esta movimentação será <b>excluída definitivamente</b> e o saldo do estoque será recalculado. Deseja continuar?',
          ()=>{ Mov.estornar(id); Toast.ok('Movimentação estornada.','O saldo foi recalculado.'); App.render(); },
          {danger:true, yes:'Sim, estornar'});
      });
    }
  });
};
</script>
<script>
/* ==========================================================================
   VIEW: OBRAS
   ========================================================================== */
Views.obras = function(){
  const obras = DB.obras.all();
  const movs = DB.movimentacoes.all();
  const ativas = obras.filter(o=>o.status==='andamento').length;

  let h = pageHead('fa-building-flag','Obras', obras.length+' obras cadastradas · '+ativas+' em andamento',
    '<button class="btn btn-primary btn-sm" onclick="Forms.editarObra()"><i class="fa-solid fa-plus"></i> Nova obra</button>');

  if(!obras.length) return h+'<div class="card">'+emptyState('fa-building-flag','Nenhuma obra cadastrada','Cadastre as obras para registrar as saídas de material.','<button class="btn btn-primary" onclick="Forms.editarObra()"><i class="fa-solid fa-plus"></i> Cadastrar obra</button>')+'</div>';

  const ordem={andamento:0,planejada:1,pausada:2,concluida:3};
  h += '<div class="list">';
  obras.sort((a,b)=>(ordem[a.status]||9)-(ordem[b.status]||9)).forEach(o=>{
    const mv = movs.filter(m=>m.obraId===o.id);
    const env = mv.filter(m=>m.tipo==='saida').reduce((s,m)=>s+numRaw(m.valorTotal),0)
              - mv.filter(m=>m.tipo==='devolucao').reduce((s,m)=>s+numRaw(m.valorTotal),0);
    const dir = mv.filter(m=>m.tipo==='entrada_direta').reduce((s,m)=>s+numRaw(m.valorTotal),0);
    h += '<div class="item" onclick="Views.obraDetalhe(\''+o.id+'\')">'+
      '<div class="item-top"><div style="flex:1;min-width:0">'+
        '<div class="item-code">'+esc(o.codigo||'')+'</div>'+
        '<div class="item-title">'+esc(o.nome)+'</div>'+
        '<div style="font-size:12px;color:var(--gray-500);margin-top:4px"><i class="fa-solid fa-location-dot"></i> '+esc(o.endereco||'—')+'</div>'+
      '</div>'+obraBadge(o.status)+'</div>'+
      '<div class="item-meta">'+
        '<div class="mi"><span>Responsável</span><b style="font-size:12.5px">'+esc(o.responsavel||'—')+'</b></div>'+
        '<div class="mi"><span>Início</span><b style="font-size:12.5px">'+fmtDate(o.inicio)+'</b></div>'+
        '<div class="mi"><span>Do galpão (líq.)</span><b>'+moneyShort(env)+'</b></div>'+
        '<div class="mi"><span>Entrega direta</span><b>'+moneyShort(dir)+'</b></div>'+
      '</div></div>';
  });
  h += '</div>';
  return h;
};

Views.obraDetalhe = function(id){
  const o = DB.obras.get(id); if(!o) return;
  const mv = DB.movimentacoes.all().filter(m=>m.obraId===id).sort((a,b)=>(b.data+(b.criadoEm||'')).localeCompare(a.data+(a.criadoEm||'')));
  const env = mv.filter(m=>m.tipo==='saida'), dir = mv.filter(m=>m.tipo==='entrada_direta');
  const dev = mv.filter(m=>m.tipo==='devolucao');
  const vDev = dev.reduce((s,m)=>s+numRaw(m.valorTotal),0);
  const vEnv = env.reduce((s,m)=>s+numRaw(m.valorTotal),0) - vDev;
  const vDir = dir.reduce((s,m)=>s+numRaw(m.valorTotal),0);

  let b = '<div class="row-between" style="margin-bottom:14px"><div>'+
    '<div class="item-code">'+esc(o.codigo||'')+'</div>'+
    '<div style="font-size:18px;font-weight:700;letter-spacing:-.3px">'+esc(o.nome)+'</div></div>'+obraBadge(o.status)+'</div>';

  b += '<div class="kpi-grid" style="grid-template-columns:repeat(3,1fr)">'+
    '<div class="kpi k-blue"><div class="kl">Do galpão (líq.)</div><div class="kv" style="font-size:17px">'+moneyShort(vEnv)+'</div><div class="kd">'+env.length+' envios'+(dev.length?' · '+dev.length+' devol.':'')+'</div></div>'+
    '<div class="kpi k-navy"><div class="kl">Direto na obra</div><div class="kv" style="font-size:17px">'+moneyShort(vDir)+'</div><div class="kd">'+dir.length+' itens</div></div>'+
    '<div class="kpi k-green"><div class="kl">Total recebido</div><div class="kv" style="font-size:17px">'+moneyShort(vEnv+vDir)+'</div><div class="kd">'+mv.length+' movimentações</div></div>'+
  '</div>'+
  (vDev>0?'<div class="alert a-green" style="margin-top:10px"><i class="fa-solid fa-rotate-left"></i><div>'+
     '<b>'+moneyShort(vDev)+'</b> em material devolvido ao galpão já foi descontado do total desta obra.</div></div>':'');

  b += '<div class="form-sec">Dados da obra</div><div class="kv-list">'+
    kv('Código', esc(o.codigo||'—'))+ kv('Endereço', esc(o.endereco||'—'))+
    kv('Responsável', esc(o.responsavel||'—'))+ kv('Data de início', fmtDate(o.inicio))+
    kv('Status', obraBadge(o.status))+ (o.obs?kv('Observações', esc(o.obs)):'')+
  '</div>';

  /* Consolidado de materiais recebidos */
  const cons = {};
  mv.forEach(m=>{
    if(m.tipo!=='saida' && m.tipo!=='entrada_direta' && m.tipo!=='devolucao') return;
    const k=m.materialId;
    if(!cons[k]) cons[k]={desc:m.materialDesc||nomeMat(k), un:m.unidade, galpao:0, direto:0, devolvido:0, valor:0};
    if(m.tipo==='saida'){ cons[k].galpao += numRaw(m.quantidade); cons[k].valor += numRaw(m.valorTotal); }
    else if(m.tipo==='devolucao'){ cons[k].galpao -= numRaw(m.quantidade); cons[k].devolvido += numRaw(m.quantidade); cons[k].valor -= numRaw(m.valorTotal); }
    else { cons[k].direto += numRaw(m.quantidade); cons[k].valor += numRaw(m.valorTotal); }
  });
  const consArr = Object.values(cons).sort((a,b)=>b.valor-a.valor);
  b += '<div class="form-sec">Materiais recebidos pela obra</div>';
  if(!consArr.length) b += '<p class="muted" style="font-size:13px">Nenhum material enviado ainda.</p>';
  else{
    b += '<div class="scroll-x"><table style="min-width:440px"><thead><tr><th>Material</th><th class="num">Do galpão</th><th class="num">Devolvido</th><th class="num">Direto</th><th class="num">Valor</th></tr></thead><tbody>';
    consArr.forEach(c=>{ b += '<tr style="cursor:default"><td><b style="font-size:13px">'+esc(c.desc)+'</b></td>'+
      '<td class="num">'+qty(c.galpao)+' <span class="tsub">'+esc(c.un)+'</span></td>'+
      '<td class="num">'+(c.devolvido?'<span style="color:var(--green);font-weight:700">−'+qty(c.devolvido)+'</span>':'—')+'</td>'+
      '<td class="num">'+qty(c.direto)+' <span class="tsub">'+esc(c.un)+'</span></td>'+
      '<td class="num tabular">'+money(c.valor)+'</td></tr>'; });
    b += '</tbody></table></div>';
  }

  Modal.open({
    title:'Detalhe da obra', icon:'fa-building-flag', wide:true, body:b,
    footer:'<button class="btn btn-outline" onclick="Modal.close();Forms.editarObra(\''+id+'\')"><i class="fa-solid fa-pen"></i> Editar</button>'+
           (Mov.pendentesObra(id).length?'<button class="btn btn-green" onclick="Modal.close();Forms.novaDevolucao({obraId:\''+id+'\'})"><i class="fa-solid fa-rotate-left"></i> Devolver</button>':'')+
           '<button class="btn btn-primary" onclick="Modal.close();Forms.novaSaida()"><i class="fa-solid fa-arrow-up"></i> Enviar material</button>'
  });
};

Views.materiais_init = function(){
  const i=$('#matBusca'); if(i) i.addEventListener('input',debounce(e=>{App.state.matBusca=e.target.value;renderMats();},160));
  $$('.chip[data-c]').forEach(b=>b.addEventListener('click',()=>{ App.state.matCat=b.dataset.c;
    $$('.chip[data-c]').forEach(x=>x.classList.toggle('active',x===b)); renderMats(); }));
  renderMats();
};
function renderMats(){
  const q=(App.state.matBusca||'').toLowerCase().trim(), c=App.state.matCat;
  const saldos = Stock.saldos();
  const rows = DB.materiais.all().filter(m=>{
    if(c && m.categoria!==c) return false;
    if(!q) return true;
    return (m.descricao+' '+m.codigo+' '+(m.ean||'')+' '+(m.codFornecedor||'')).toLowerCase().includes(q);
  }).sort((a,b)=>a.descricao.localeCompare(b.descricao,'pt-BR'));
  const el=$('#matLista'); if(!el) return;
  if(!rows.length){ el.innerHTML='<div class="card">'+emptyState('fa-cube','Nenhum material','Ajuste a busca ou cadastre um novo material.')+'</div>'; return; }

  let cards='<div class="list as-table">';
  rows.forEach(m=>{
    cards += '<div class="item" onclick="Forms.editarMaterial(\''+m.id+'\')">'+
      '<div class="item-top">'+miniFoto(m)+'<div style="flex:1;min-width:0">'+
      '<div class="item-code">'+esc(m.codigo)+' · '+esc(m.categoria)+'</div>'+
      '<div class="item-title">'+esc(m.descricao)+'</div></div>'+
      (m.ativo===false?'<span class="badge b-gray">Inativo</span>':'<span class="badge b-green">Ativo</span>')+'</div>'+
      '<div class="item-meta">'+
        '<div class="mi"><span>Saldo</span><b>'+qty(saldos[m.id]||0)+' '+esc(m.unidade)+'</b></div>'+
        '<div class="mi"><span>Mínimo</span><b>'+qty(m.estoqueMinimo)+'</b></div>'+
        '<div class="mi"><span>Ideal</span><b>'+qty(m.estoqueIdeal)+'</b></div>'+
        '<div class="mi"><span>Custo médio</span><b>'+money(m.custoMedio)+'</b></div>'+
      '</div></div>';
  });
  cards+='</div>';

  let tb='<div class="card table-wrap"><table><thead><tr><th>Código</th><th>Descrição</th><th>Categoria</th><th>Un.</th>'+
    '<th class="num">Saldo</th><th class="num">Mín.</th><th class="num">Ideal</th><th class="num">Custo médio</th><th>EAN</th><th>Fornecedor</th><th>Situação</th></tr></thead><tbody>';
  rows.forEach(m=>{
    tb += '<tr onclick="Forms.editarMaterial(\''+m.id+'\')">'+
      '<td class="tsub tabular">'+esc(m.codigo)+'</td>'+
      '<td class="tm"><div style="display:flex;align-items:center;gap:10px;min-width:0">'+
        miniFoto(m)+'<span style="min-width:0">'+esc(m.descricao)+'</span></div></td>'+
      '<td><span class="badge b-gray">'+esc(m.categoria)+'</span></td><td class="tsub">'+esc(m.unidade)+'</td>'+
      '<td class="num" style="font-weight:700">'+qty(saldos[m.id]||0)+'</td>'+
      '<td class="num tsub">'+qty(m.estoqueMinimo)+'</td><td class="num tsub">'+qty(m.estoqueIdeal)+'</td>'+
      '<td class="num tabular">'+money(m.custoMedio)+'</td>'+
      '<td class="tsub tabular">'+esc(m.ean||'—')+'</td>'+
      '<td class="tsub">'+(m.fornecedorId?esc(nomeForn(m.fornecedorId)):'—')+'</td>'+
      '<td>'+(m.ativo===false?'<span class="badge b-gray">Inativo</span>':'<span class="badge b-green">Ativo</span>')+'</td></tr>';
  });
  tb+='</tbody></table></div>';
  el.innerHTML = cards+tb;
}

Forms.editarMaterial = function(id){
  const m = id?DB.materiais.get(id):{ativo:true, unidade:'UN', categoria:'Outros'};
  const cats = catList();
  const forns = DB.fornecedores.all();
  const nextCode = 'MAT-'+String(DB.materiais.all().length+1).padStart(3,'0');

  let b = '<div class="grid2">'+
    '<div class="field"><label>Código interno <span class="req">*</span></label><input class="input" id="mtCod" value="'+esc(m.codigo||nextCode)+'"></div>'+
    '<div class="field"><label>Unidade <span class="req">*</span></label><select class="input" id="mtUn">'+
      UNIDADES.map(u=>opt(u,u,m.unidade)).join('')+'</select></div>'+
  '</div>'+
  '<div class="field"><label>Descrição <span class="req">*</span></label><input class="input" id="mtDesc" value="'+esc(m.descricao||'')+'" placeholder="Ex.: Cimento CP-II-E-32 saco 50kg"></div>'+
  '<div class="field"><label>Categoria <span class="req">*</span></label><select class="input" id="mtCat">'+
    cats.map(c=>opt(c,c,m.categoria)).join('')+'</select></div>'+
  '<div class="form-sec">Parâmetros de estoque</div>'+
  '<div class="grid3">'+
    '<div class="field"><label>Estoque mínimo</label><input type="number" class="input" id="mtMin" value="'+numRaw(m.estoqueMinimo)+'" min="0" step="0.001" inputmode="decimal"></div>'+
    '<div class="field"><label>Estoque ideal</label><input type="number" class="input" id="mtIdeal" value="'+numRaw(m.estoqueIdeal)+'" min="0" step="0.001" inputmode="decimal"></div>'+
    '<div class="field"><label>Custo médio (R$)</label><input type="number" class="input" id="mtCusto" value="'+numRaw(m.custoMedio)+'" min="0" step="0.01" inputmode="decimal"></div>'+
  '</div>'+
  '<div class="form-sec">Identificação e fornecimento</div>'+
  '<div class="grid2">'+
    '<div class="field"><label>Código EAN</label><input class="input" id="mtEan" value="'+esc(m.ean||'')+'" inputmode="numeric" placeholder="Opcional"></div>'+
    '<div class="field"><label>Cód. no fornecedor</label><input class="input" id="mtCodF" value="'+esc(m.codFornecedor||'')+'" placeholder="Opcional"></div>'+
  '</div>'+
  '<div class="field"><label>Fornecedor principal</label><select class="input" id="mtForn">'+
    selectOpts(forns,'id','fantasia',m.fornecedorId,'Nenhum')+'</select></div>'+
  (window.Fotos ?
  '<div class="form-sec">Foto</div>'+
  '<div class="foto-campo">'+
    '<div class="foto-prev" id="mtFotoPrev">'+
      (m.fotoUrl ? '<img src="'+esc(m.fotoUrl)+'" alt="Foto do material">'
                 : '<i class="fa-solid fa-camera"></i>')+
    '</div>'+
    '<div class="foto-acoes">'+
      '<input type="file" id="mtFotoArq" accept="image/*" capture="environment" hidden>'+
      '<button type="button" class="btn btn-outline btn-sm" id="mtFotoBtn">'+
        '<i class="fa-solid fa-camera"></i> '+(m.fotoUrl?'Trocar foto':'Adicionar foto')+'</button>'+
      '<button type="button" class="btn btn-red btn-sm" id="mtFotoDel"'+
        (m.fotoUrl?'':' style="display:none"')+'><i class="fa-solid fa-trash"></i> Remover</button>'+
      '<div class="foto-msg" id="mtFotoMsg">Opcional. A imagem é reduzida antes de enviar.</div>'+
    '</div>'+
  '</div>' : '')+
  '<label class="switch"><input type="checkbox" id="mtAtivo"'+(m.ativo!==false?' checked':'')+'><span class="track"></span>'+
    '<span style="font-size:13.5px;font-weight:600">Material ativo</span></label>';

  Modal.open({
    title: id?'Editar material':'Novo material', icon:'fa-cube', wide:true, body:b,
    footer:(id?'<button class="btn btn-red" id="mtDel"><i class="fa-solid fa-trash"></i></button>':'')+
           '<button class="btn btn-outline" data-close>Cancelar</button><button class="btn btn-primary" id="mtSalvar"><i class="fa-solid fa-check"></i> Salvar</button>',
    onMount:ov=>{
      /* ---------------------------------------------------------------
         Foto do material.
         A imagem sobe assim que é escolhida, não no Salvar: assim o
         usuário vê na hora se deu certo, e o Salvar não fica travado
         esperando upload em rede de obra. fotoUrl guarda o resultado. */
      let fotoUrl = m.fotoUrl || null;
      let fotoApagar = null;          // endereço antigo, apagado só ao salvar
      const fArq=$('#mtFotoArq',ov), fBtn=$('#mtFotoBtn',ov),
            fDel=$('#mtFotoDel',ov), fPrev=$('#mtFotoPrev',ov), fMsg=$('#mtFotoMsg',ov);

      if(fArq){
        fBtn.addEventListener('click',()=>fArq.click());

        fArq.addEventListener('change',async()=>{
          const arq=fArq.files && fArq.files[0];
          if(!arq) return;
          const antes=fBtn.innerHTML;
          fBtn.disabled=true; fDel.disabled=true;
          fBtn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Enviando...';
          fMsg.textContent='Reduzindo e enviando a imagem...';
          try{
            const chave = id || (m.__fotoChave = m.__fotoChave || Fotos.novaChave());
            const empresa = window.ObraStockEmpresaId || 'demo';
            const url = await Fotos.enviar(arq, empresa, chave);
            if(fotoUrl && fotoUrl!==url) fotoApagar = fotoUrl;
            fotoUrl = url;
            fPrev.innerHTML='<img src="'+esc(url)+'" alt="Foto do material">';
            fDel.style.display=''; fDel.disabled=false;
            fBtn.innerHTML='<i class="fa-solid fa-camera"></i> Trocar foto';
            fMsg.textContent='Foto pronta. Ela só será gravada quando você salvar.';
          }catch(e){
            fBtn.innerHTML=antes;
            fMsg.textContent='';
            Toast.err('Não foi possível enviar a foto', e.message||'Tente outra imagem.');
          }finally{
            fBtn.disabled=false; fArq.value='';
          }
        });

        fDel.addEventListener('click',()=>{
          if(fotoUrl) fotoApagar = fotoUrl;
          fotoUrl=null;
          fPrev.innerHTML='<i class="fa-solid fa-camera"></i>';
          fDel.style.display='none';
          fBtn.innerHTML='<i class="fa-solid fa-camera"></i> Adicionar foto';
          fMsg.textContent='A foto será removida quando você salvar.';
        });
      }

      $('#mtSalvar',ov).addEventListener('click',()=>{
        const desc=$('#mtDesc',ov).value.trim(), cod=$('#mtCod',ov).value.trim();
        if(!desc){ Toast.err('Informe a descrição'); return; }
        if(!cod){ Toast.err('Informe o código interno'); return; }
        const dup = DB.materiais.all().find(x=>x.codigo.toLowerCase()===cod.toLowerCase() && x.id!==id);
        if(dup){ Toast.err('Código já utilizado', 'O código '+cod+' pertence a outro material.'); return; }
        const d={codigo:cod, descricao:desc, categoria:$('#mtCat',ov).value, unidade:$('#mtUn',ov).value,
          estoqueMinimo:numRaw($('#mtMin',ov).value), estoqueIdeal:numRaw($('#mtIdeal',ov).value),
          custoMedio:numRaw($('#mtCusto',ov).value), ean:$('#mtEan',ov).value.trim(),
          codFornecedor:$('#mtCodF',ov).value.trim(), fornecedorId:$('#mtForn',ov).value||null,
          ativo:$('#mtAtivo',ov).checked};
        if(window.Fotos) d.fotoUrl = fotoUrl;
        if(id) DB.materiais.upd(id,d); else DB.materiais.add(d);
        /* Só agora o arquivo antigo some: se o usuário desistisse no meio,
           teríamos apagado uma foto que continua valendo no banco. */
        if(fotoApagar && window.Fotos) Fotos.removerPorUrl(fotoApagar);
        Modal.close(); Toast.ok(id?'Material atualizado.':'Material cadastrado.'); App.render();
      });
      const del=$('#mtDel',ov);
      if(del) del.addEventListener('click',()=>{
        const usado = DB.movimentacoes.all().some(x=>x.materialId===id);
        Modal.close();
        if(usado){ Toast.err('Não é possível excluir','Existem movimentações com este material. Marque-o como inativo.'); return; }
        Modal.confirm('Excluir material?','Esta ação não pode ser desfeita.',()=>{ DB.materiais.del(id); if(m.fotoUrl && window.Fotos) Fotos.removerPorUrl(m.fotoUrl); Toast.ok('Material excluído.'); App.render(); },{danger:true,yes:'Excluir'});
      });
    }
  });
};

Forms.gerenciarCategorias = function(){
  function body(){
    const cats = DB.categorias.all();
    return '<div class="field"><label>Nova categoria</label><div style="display:flex;gap:8px">'+
      '<input class="input" id="ctNome" placeholder="Ex.: Impermeabilizantes">'+
      '<button class="btn btn-primary" id="ctAdd" style="flex-shrink:0"><i class="fa-solid fa-plus"></i></button></div></div>'+

      '<div class="list">'+cats.map(c=>{
        const n = DB.materiais.all().filter(m=>m.categoria===c.nome).length;
        return '<div class="cart-line"><div class="cl-main"><b>'+esc(c.nome)+'</b><small>'+n+' material(is)</small></div>'+
          (n?'<span class="badge b-gray">em uso</span>':'<button class="icon-btn" style="background:var(--red-soft);color:var(--red);width:32px;height:32px" data-delc="'+c.id+'"><i class="fa-solid fa-trash"></i></button>')+'</div>';
      }).join('')+'</div>';
  }
  Modal.open({
    title:'Categorias', icon:'fa-tags', body:body(),
    footer:'<button class="btn btn-outline btn-block" data-close>Fechar</button>',
    onMount:function bind(ov){
      const rebind=()=>{ $('.sheet-body',ov).innerHTML=body(); bind(ov); };
      $('#ctAdd',ov).addEventListener('click',()=>{
        const n=$('#ctNome',ov).value.trim();
        if(!n){ Toast.err('Informe o nome'); return; }

        DB.categorias.add({nome:n}); Toast.ok('Categoria criada.'); rebind();
      });
      $$('[data-delc]',ov).forEach(b=>b.addEventListener('click',()=>{ DB.categorias.del(b.dataset.delc); Toast.ok('Categoria excluída.'); rebind(); }));
    }
  });
};
