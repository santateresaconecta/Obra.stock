/* -------------------- PARSER DE XML NF-e -------------------- */
const NFeParser = {
  parse(xmlText){
    const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
    if(doc.querySelector('parsererror')) throw new Error('Arquivo XML inválido ou corrompido.');
    const T = (el,tag)=>{ if(!el) return ''; const n=NFeParser.find(el,tag); return n?n.textContent.trim():''; };

    const infNFe = NFeParser.find(doc,'infNFe');
    if(!infNFe) throw new Error('Este arquivo não parece ser uma NF-e (tag infNFe não encontrada).');

    const ide = NFeParser.find(infNFe,'ide');
    const emit = NFeParser.find(infNFe,'emit');
    const dest = NFeParser.find(infNFe,'dest');
    const total = NFeParser.find(infNFe,'ICMSTot');

    let chave = (infNFe.getAttribute('Id')||'').replace(/^NFe/i,'');
    if(!chave){ const cn=NFeParser.find(doc,'chNFe'); chave = cn?cn.textContent.trim():''; }

    const emitEnd = NFeParser.find(emit,'enderEmit');

    const itens = [];
    NFeParser.findAll(doc,'det').forEach(det=>{
      const prod = NFeParser.find(det,'prod'); if(!prod) return;
      const ean = T(prod,'cEAN');
      itens.push({
        item: det.getAttribute('nItem')||'',
        codigo: T(prod,'cProd'),
        descricao: T(prod,'xProd'),
        ncm: T(prod,'NCM'),
        cfop: T(prod,'CFOP'),
        unidade: (T(prod,'uCom')||'UN').toUpperCase().slice(0,5),
        qtd: numRaw(T(prod,'qCom')),
        valorUnit: Math.round(numRaw(T(prod,'vUnCom'))*100)/100,
        valorTotal: Math.round(numRaw(T(prod,'vProd'))*100)/100,
        ean: (ean && ean.toUpperCase()!=='SEM GTIN') ? ean : '',
        materialId:null
      });
    });
    if(!itens.length) throw new Error('Nenhum produto encontrado no XML.');

    return {
      chave, numero:T(ide,'nNF'), serie:T(ide,'serie'),
      emissao:(T(ide,'dhEmi')||T(ide,'dEmi')||'').slice(0,10),
      emitenteCnpj:T(emit,'CNPJ')||T(emit,'CPF'),
      emitenteNome:T(emit,'xNome'), emitenteFantasia:T(emit,'xFant'),
      emitenteCidade:(T(emitEnd,'xMun')||'')+(T(emitEnd,'UF')?'/'+T(emitEnd,'UF'):''),
      emitenteFone:T(emitEnd,'fone'),
      destinatarioCnpj:T(dest,'CNPJ')||T(dest,'CPF'),
      destinatarioNome:T(dest,'xNome'),
      valorTotal: Math.round((numRaw(T(total,'vNF'))||itens.reduce((s,i)=>s+i.valorTotal,0))*100)/100,
      itens
    };
  },
  find(root, tag){
    if(!root) return null;
    const direct = root.getElementsByTagName(tag);
    if(direct.length) return direct[0];
    const all = root.getElementsByTagName('*');
    for(let i=0;i<all.length;i++){ if(all[i].localName===tag) return all[i]; }
    return null;
  },
  findAll(root, tag){
    if(!root) return [];
    let r = Array.from(root.getElementsByTagName(tag));
    if(r.length) return r;
    return Array.from(root.getElementsByTagName('*')).filter(e=>e.localName===tag);
  },
  /** Tenta casar item do XML com material cadastrado (EAN > cód. fornecedor > descrição) */
  matchMaterial(item){
    const mats = DB.materiais.all();
    if(item.ean){ const m = mats.find(x=>x.ean && x.ean===item.ean); if(m) return m; }
    if(item.codigo){ const m = mats.find(x=>x.codFornecedor && x.codFornecedor.toLowerCase()===item.codigo.toLowerCase()); if(m) return m; }
    if(item.codigo){ const m = mats.find(x=>x.codigo.toLowerCase()===item.codigo.toLowerCase()); if(m) return m; }
    const d = (item.descricao||'').toLowerCase();
    if(d.length>6){
      let best=null, bestScore=0;
      mats.forEach(x=>{
        const w = x.descricao.toLowerCase().split(/[\s\-]+/).filter(t=>t.length>3);
        const hit = w.filter(t=>d.includes(t)).length;
        const score = w.length?hit/w.length:0;
        if(score>bestScore){ bestScore=score; best=x; }
      });
      if(bestScore>=0.55) return best;
    }
    return null;
  }
};

Forms.importarXML = function(){
  let b = '<div class="file-drop" id="xmlDrop">'+
      '<i class="fa-solid fa-file-code"></i><b>Selecionar arquivo XML da NF-e</b>'+
      '<small>Toque para escolher ou arraste o arquivo aqui</small>'+
      '<input type="file" id="xmlFile" accept=".xml,text/xml,application/xml" multiple style="display:none"></div>'+
    '<div class="alert a-blue" style="margin-top:14px"><i class="fa-solid fa-circle-info"></i><div>'+
      'O sistema lê chave de acesso, número, série, emitente, destinatário, produtos, NCM, CFOP, EAN e valores. '+
      'Você poderá revisar e vincular cada produto antes de confirmar.</div></div>'+
    '<div id="xmlOut" style="margin-top:14px"></div>';

  Modal.open({
    title:'Importar XML de NF-e', icon:'fa-file-code', wide:true, body:b,
    footer:'<button class="btn btn-outline btn-block" data-close>Fechar</button>',
    onMount:ov=>{
      const drop=$('#xmlDrop',ov), file=$('#xmlFile',ov);
      drop.addEventListener('click',()=>file.click());
      drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over');});
      drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
      drop.addEventListener('drop',e=>{ e.preventDefault(); drop.classList.remove('over');
        if(e.dataTransfer.files.length) handle(e.dataTransfer.files[0]); });
      file.addEventListener('change',()=>{ if(file.files.length) handle(file.files[0]); });

      function handle(f){
        const r = new FileReader();
        r.onload = ()=>{
          try{
            const nfe = NFeParser.parse(r.result);
            Modal.close();
            Forms.revisarXML(nfe);
          }catch(err){
            $('#xmlOut',ov).innerHTML='<div class="alert a-red"><i class="fa-solid fa-circle-exclamation"></i><div><b>Não foi possível ler o arquivo.</b><br>'+esc(err.message)+'</div></div>';
          }
        };
        r.onerror = ()=>{ $('#xmlOut',ov).innerHTML='<div class="alert a-red"><i class="fa-solid fa-circle-exclamation"></i><div>Erro ao ler o arquivo.</div></div>'; };
        r.readAsText(f, 'UTF-8');
      }
    }
  });
};

Forms.revisarXML = function(nfe){
  /* fornecedor: casa por CNPJ ou oferece criação */
  const forns = DB.fornecedores.all();
  let forn = forns.find(f=>String(f.cnpj).replace(/\D/g,'')===nfe.emitenteCnpj);
  const obras = DB.obras.all().filter(o=>o.status!=='concluida');
  const dup = DB.notas.all().find(n=>n.chave && nfe.chave && n.chave===nfe.chave);

  /* pré-vincula materiais */
  nfe.itens.forEach(i=>{ const m=NFeParser.matchMaterial(i); i.materialId = m?m.id:null; i.novoMaterial = !m; });

  function itensHTML(){
    return nfe.itens.map((i,idx)=>{
      const m = i.materialId?DB.materiais.get(i.materialId):null;
      return '<div class="card card-pad" style="padding:12px;margin-bottom:9px'+(i.ignorar?';opacity:.5':'')+'">'+
        '<div class="row-between" style="margin-bottom:8px"><div style="flex:1;min-width:0">'+
          '<b style="font-size:13px;display:block;line-height:1.3">'+esc(i.descricao)+'</b>'+
          '<small class="muted" style="font-size:11px">Cód. '+esc(i.codigo||'—')+(i.ean?' · EAN '+esc(i.ean):'')+' · NCM '+esc(i.ncm||'—')+' · CFOP '+esc(i.cfop||'—')+'</small></div>'+
          '<div style="text-align:right;flex-shrink:0"><div style="font-weight:800;font-size:13.5px">'+qty(i.qtd)+' '+esc(i.unidade)+'</div>'+
          '<div style="font-size:11px;color:var(--gray-500)">'+money(i.valorUnit)+' un.</div></div></div>'+
        '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+
          (m?'<span class="badge b-green" style="flex-shrink:0"><i class="fa-solid fa-link"></i>'+esc(m.descricao.slice(0,34))+'</span>'
             :'<span class="badge b-amber" style="flex-shrink:0"><i class="fa-solid fa-circle-plus"></i>Será criado novo material</span>')+
          '<button class="btn btn-sm btn-outline" data-vinc="'+idx+'" style="margin-left:auto"><i class="fa-solid fa-link"></i> Vincular</button>'+
          '<button class="btn btn-sm '+(i.ignorar?'btn-outline':'btn-ghost')+'" data-ign="'+idx+'">'+(i.ignorar?'<i class="fa-solid fa-rotate-left"></i> Incluir':'<i class="fa-solid fa-ban"></i> Ignorar')+'</button>'+
        '</div></div>';
    }).join('');
  }

  let b = '';
  if(dup) b += '<div class="alert a-red" style="margin-bottom:14px"><i class="fa-solid fa-triangle-exclamation"></i><div><b>Nota já importada.</b> Uma NF com esta chave de acesso já existe no sistema.</div></div>';

  b += '<div class="alert a-green" style="margin-bottom:16px"><i class="fa-solid fa-circle-check"></i><div><b>XML lido com sucesso.</b> '+nfe.itens.length+' produto(s) encontrado(s).</div></div>';

  b += '<div class="form-sec">Dados da nota</div><div class="kv-list">'+
    kv('Número / Série', esc(nfe.numero)+' / '+esc(nfe.serie||'1'))+
    kv('Emissão', fmtDate(nfe.emissao))+
    kv('Emitente', esc(nfe.emitenteNome))+
    kv('CNPJ emitente', esc(cnpjFmt(nfe.emitenteCnpj)))+
    kv('Destinatário', esc(nfe.destinatarioNome||'—'))+
    kv('CNPJ destinatário', esc(cnpjFmt(nfe.destinatarioCnpj)))+
    (nfe.chave?kv('Chave de acesso','<span style="font-size:10.5px;font-family:monospace;word-break:break-all">'+esc(nfe.chave)+'</span>'):'')+
    kv('Valor total','<b style="font-size:15px">'+money(nfe.valorTotal)+'</b>')+
  '</div>';

  b += '<div class="form-sec">Fornecedor</div>';
  b += forn ? '<div class="alert a-green"><i class="fa-solid fa-circle-check"></i><div>Vinculado a <b>'+esc(forn.fantasia||forn.razaoSocial)+'</b></div></div>'
            : '<div class="alert a-amber"><i class="fa-solid fa-circle-plus"></i><div>Fornecedor não cadastrado — será criado automaticamente como <b>'+esc(nfe.emitenteNome)+'</b></div></div>';

  b += '<div class="form-sec">Destino da mercadoria</div>'+
    '<div class="radio-row" style="margin-bottom:12px">'+
      '<button type="button" class="radio-card on" data-dest="galpao"><i class="fa-solid fa-warehouse"></i><b>Estoque Principal</b><small>Entra no galpão</small></button>'+
      '<button type="button" class="radio-card" data-dest="obra"><i class="fa-solid fa-truck-ramp-box"></i><b>Entrega Direta</b><small>Direto na obra</small></button>'+
    '</div>'+
    '<div class="field hide" id="xObraF"><label>Obra <span class="req">*</span></label>'+
      '<select class="input" id="xObra">'+selectOpts(obras,'id','nome','','Selecione a obra…')+'</select></div>';

  b += '<div class="form-sec">Produtos ('+nfe.itens.length+')</div><div id="xItens">'+itensHTML()+'</div>';
  b += '<div class="field" style="margin-top:14px"><label>Observação</label><textarea class="input" id="xObs" placeholder="Opcional"></textarea></div>';

  Modal.open({
    title:'Revisar importação', icon:'fa-file-import', wide:true, body:b,
    footer:'<button class="btn btn-outline" data-close>Cancelar</button>'+
           '<button class="btn btn-green" id="xConfirm"><i class="fa-solid fa-check"></i> Importar e dar entrada</button>',
    onMount:ov=>{
      let destino='galpao';
      const mats = DB.materiais.all().sort((a,b)=>a.descricao.localeCompare(b.descricao,'pt-BR'));
      $$('[data-dest]',ov).forEach(btn=>btn.addEventListener('click',()=>{
        destino=btn.dataset.dest;
        $$('[data-dest]',ov).forEach(x=>x.classList.toggle('on',x===btn));
        $('#xObraF',ov).classList.toggle('hide',destino!=='obra');
      }));
      function bindItens(){
        $('#xItens',ov).innerHTML = itensHTML();
        $$('[data-vinc]',ov).forEach(x=>x.addEventListener('click',()=>{
          const idx=+x.dataset.vinc;
          Picker.material(mats, m=>{ nfe.itens[idx].materialId=m.id; nfe.itens[idx].novoMaterial=false; bindItens(); });
        }));
        $$('[data-ign]',ov).forEach(x=>x.addEventListener('click',()=>{
          const idx=+x.dataset.ign; nfe.itens[idx].ignorar=!nfe.itens[idx].ignorar; bindItens();
        }));
      }
      bindItens();

      $('#xConfirm',ov).addEventListener('click',()=>{
        const obraId = $('#xObra',ov).value, obs=$('#xObs',ov).value.trim();
        if(destino==='obra' && !obraId){ Toast.err('Selecione a obra de destino'); return; }
        const itens = nfe.itens.filter(i=>!i.ignorar);
        if(!itens.length){ Toast.err('Nenhum produto selecionado'); return; }

        /* cria fornecedor se necessário */
        if(!forn){
          forn = DB.fornecedores.add({razaoSocial:nfe.emitenteNome, fantasia:nfe.emitenteFantasia||nfe.emitenteNome,
            cnpj:cnpjFmt(nfe.emitenteCnpj), telefone:nfe.emitenteFone||'', email:'',
            cidade:nfe.emitenteCidade||'', obs:'Cadastrado automaticamente via importação de XML.'});
        }
        /* cria materiais faltantes */
        let criados=0;
        itens.forEach(i=>{
          if(i.materialId) return;
          const n = DB.materiais.all().length+1;
          const novo = DB.materiais.add({codigo:'MAT-'+String(n).padStart(3,'0'), descricao:i.descricao,
            categoria:'Outros', unidade:i.unidade||'UN', estoqueMinimo:0, estoqueIdeal:0,
            custoMedio:i.valorUnit, ean:i.ean||'', codFornecedor:i.codigo||'', fornecedorId:forn.id, ativo:true});
          i.materialId = novo.id; criados++;
        });

        const cfg = DB.config.get();
        const nf = DB.notas.add({numero:nfe.numero, serie:nfe.serie||'1', chave:nfe.chave, emissao:nfe.emissao||todayISO(),
          fornecedorId:forn.id, emitenteNome:nfe.emitenteNome, emitenteCnpj:nfe.emitenteCnpj,
          destinatarioCnpj:nfe.destinatarioCnpj, valorTotal:nfe.valorTotal, origem:'xml',
          destino:destino, obraId:destino==='obra'?obraId:null,
          itens: itens.map(i=>({codigo:i.codigo, descricao:i.descricao, qtd:i.qtd, unidade:i.unidade,
            valorUnit:i.valorUnit, valorTotal:i.valorTotal, ncm:i.ncm, cfop:i.cfop, ean:i.ean, materialId:i.materialId}))});

        const tipo = destino==='obra'?'entrada_direta':'entrada';
        itens.forEach(i=>{
          Mov.criar({tipo, data:nfe.emissao||todayISO(), materialId:i.materialId, materialDesc:i.descricao,
            unidade:i.unidade, quantidade:i.qtd, valorUnitario:i.valorUnit, valorTotal:i.valorTotal,
            fornecedorId:forn.id, nfNumero:nfe.numero, nfId:nf.id,
            origem:forn.fantasia||forn.razaoSocial,
            destino: destino==='obra'?nomeObra(obraId):cfg.galpao,
            obraId: destino==='obra'?obraId:null, observacao:obs||('Importado do XML da NF-e '+nfe.numero)});
        });

        Modal.close();
        Toast.ok('NF-e importada com sucesso.', itens.length+' itens · '+money(nfe.valorTotal)+(criados?' · '+criados+' material(is) criado(s)':''));
        App.go('notas');
      });
    }
  });
};
</script>
<script>
/* ==========================================================================
   VIEW: RELATÓRIOS
   ========================================================================== */
const Reports = {};

Views.relatorios = function(){
  const tab = App.state.relTab;
  let h = pageHead('fa-chart-column','Relatórios','Análise gerencial de entradas, saídas e estoque',
    '<button class="btn btn-outline btn-sm" onclick="window.print()"><i class="fa-solid fa-print"></i> Imprimir</button>');

  h += '<div class="mini-tabs">'+
    '<button class="'+(tab==='resumo'?'on':'')+'" data-t="resumo">Resumo</button>'+
    '<button class="'+(tab==='entradas'?'on':'')+'" data-t="entradas">Entradas</button>'+
    '<button class="'+(tab==='saidas'?'on':'')+'" data-t="saidas">Saídas</button>'+
    '<button class="'+(tab==='compras'?'on':'')+'" data-t="compras">Compras</button>'+
  '</div>';
  h += '<div id="relBody">'+Reports.render(tab)+'</div>';
  return h;
};
Views.relatorios_init = function(){
  $$('.mini-tabs button').forEach(b=>b.addEventListener('click',()=>{
    App.state.relTab=b.dataset.t;
    $$('.mini-tabs button').forEach(x=>x.classList.toggle('on',x===b));
    $('#relBody').innerHTML = Reports.render(b.dataset.t);
  }));
};

Reports.render = function(tab){
  if(tab==='entradas') return Reports.entradas();
  if(tab==='saidas') return Reports.saidas();
  if(tab==='compras') return Reports.compras();
  return Reports.resumo();
};

Reports.resumo = function(){
  const movs = DB.movimentacoes.all();
  const rows = Stock.rows().filter(r=>r.ativo);
  const valor = rows.reduce((s,r)=>s+r.valorTotal,0);

  /* Evolução mensal (6 meses) */
  const meses=[]; const d=new Date();
  for(let i=5;i>=0;i--){ const x=new Date(d.getFullYear(),d.getMonth()-i,1); meses.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')); }
  const serie = meses.map(mk=>{
    const mm = movs.filter(m=>monthKey(m.data)===mk);
    return {mk, ent:mm.filter(m=>m.tipo==='entrada').reduce((s,m)=>s+numRaw(m.valorTotal),0),
                sai:mm.filter(m=>m.tipo==='saida').reduce((s,m)=>s+numRaw(m.valorTotal),0)
                    -mm.filter(m=>m.tipo==='devolucao').reduce((s,m)=>s+numRaw(m.valorTotal),0),
                dir:mm.filter(m=>m.tipo==='entrada_direta').reduce((s,m)=>s+numRaw(m.valorTotal),0)};
  });
  const max = Math.max(1, ...serie.map(s=>Math.max(s.ent,s.sai)));

  let h = '<div class="kpi-grid" style="grid-template-columns:repeat(2,1fr)">'+
    kpi('navy','fa-warehouse','Valor em estoque', moneyShort(valor), rows.length+' materiais')+
    kpi('green','fa-arrow-down','Total de entradas', String(movs.filter(m=>m.tipo==='entrada').length), money(movs.filter(m=>m.tipo==='entrada').reduce((s,m)=>s+numRaw(m.valorTotal),0)))+
    kpi('blue','fa-arrow-up','Saídas (líquidas)', String(movs.filter(m=>m.tipo==='saida').length), money(movs.filter(m=>m.tipo==='saida').reduce((s,m)=>s+numRaw(m.valorTotal),0)-movs.filter(m=>m.tipo==='devolucao').reduce((s,m)=>s+numRaw(m.valorTotal),0)))+
    kpi('amber','fa-truck-ramp-box','Entregas diretas', String(movs.filter(m=>m.tipo==='entrada_direta').length), money(movs.filter(m=>m.tipo==='entrada_direta').reduce((s,m)=>s+numRaw(m.valorTotal),0)))+
  '</div>';

  h += '<div class="rep-grid">';

  h += '<div class="card"><div class="card-head"><h3><i class="fa-solid fa-chart-line"></i>Entradas x Saídas — últimos 6 meses</h3></div><div class="card-pad">';
  serie.forEach(s=>{
    h += '<div style="margin-bottom:13px"><div style="font-size:11.5px;font-weight:700;color:var(--gray-600);margin-bottom:5px">'+monthName(s.mk)+'</div>'+
      '<div class="barh" style="margin-bottom:4px"><div class="bh-label" style="width:58px;font-size:11px">Entradas</div>'+
        '<div class="bh-track" style="height:16px"><div class="bh-fill g" style="width:'+((s.ent/max)*100).toFixed(0)+'%"></div></div>'+
        '<div class="bh-val" style="font-size:11px">'+moneyShort(s.ent)+'</div></div>'+
      '<div class="barh" style="margin-bottom:0"><div class="bh-label" style="width:58px;font-size:11px">Saídas</div>'+
        '<div class="bh-track" style="height:16px"><div class="bh-fill" style="width:'+((s.sai/max)*100).toFixed(0)+'%"></div></div>'+
        '<div class="bh-val" style="font-size:11px">'+moneyShort(s.sai)+'</div></div></div>';
  });
  h += '</div></div>';

  /* Por categoria */
  const cat={};
  rows.forEach(r=>{ cat[r.categoria]=(cat[r.categoria]||0)+r.valorTotal; });
  const catArr=Object.keys(cat).map(k=>({k,v:cat[k]})).sort((a,b)=>b.v-a.v);
  const maxCat=catArr.length?catArr[0].v:1;
  h += '<div class="card"><div class="card-head"><h3><i class="fa-solid fa-layer-group"></i>Valor do estoque por categoria</h3></div><div class="card-pad">';
  if(!catArr.length) h+='<p class="muted" style="font-size:13px">Sem dados.</p>';
  else catArr.forEach(c=>{
    h += '<div class="barh"><div class="bh-label">'+esc(c.k)+'</div><div class="bh-track">'+
      '<div class="bh-fill" style="width:'+((c.v/maxCat)*100).toFixed(0)+'%"></div></div>'+
      '<div class="bh-val">'+moneyShort(c.v)+'</div></div>';
  });
  h += '<div class="divider"></div><div class="row-between"><b style="font-size:13px">Total</b><b style="font-size:16px">'+money(valor)+'</b></div>';
  h += '</div></div>';
  h += '</div>';

  /* Por obra */
  const obras = DB.obras.all();
  h += '<div class="card" style="margin-top:16px"><div class="card-head"><h3><i class="fa-solid fa-building-flag"></i>Consolidado por obra</h3></div>'+
    '<div class="scroll-x"><table style="min-width:600px"><thead><tr><th>Obra</th><th>Status</th><th class="num">Saídas (itens)</th>'+
    '<th class="num">Valor do galpão</th><th class="num">Devolvido</th><th class="num">Entrega direta</th><th class="num">Total</th></tr></thead><tbody>';
  obras.forEach(o=>{
    const mv=movs.filter(m=>m.obraId===o.id);
    const sai=mv.filter(m=>m.tipo==='saida'), dir=mv.filter(m=>m.tipo==='entrada_direta');
    const dv=mv.filter(m=>m.tipo==='devolucao');
    const vdev=dv.reduce((s,m)=>s+numRaw(m.valorTotal),0);
    const vs=sai.reduce((s,m)=>s+numRaw(m.valorTotal),0)-vdev, vd=dir.reduce((s,m)=>s+numRaw(m.valorTotal),0);
    h += '<tr style="cursor:pointer" onclick="Views.obraDetalhe(\''+o.id+'\')"><td class="tm">'+esc(o.nome)+'</td><td>'+obraBadge(o.status)+'</td>'+
      '<td class="num">'+sai.length+'</td><td class="num tabular">'+money(vs)+'</td>'+
      '<td class="num tabular">'+(vdev?'<span style="color:var(--green)">−'+money(vdev)+'</span>':'—')+'</td>'+
      '<td class="num tabular">'+money(vd)+'</td><td class="num tabular" style="font-weight:800">'+money(vs+vd)+'</td></tr>';
  });
  h += '</tbody></table></div></div>';
  return h;
};

Reports.entradas = function(){
  const movs = DB.movimentacoes.all().filter(m=>m.tipo==='entrada'||m.tipo==='entrada_direta')
    .sort((a,b)=>b.data.localeCompare(a.data));
  const tot = movs.reduce((s,m)=>s+numRaw(m.valorTotal),0);
  const gal = movs.filter(m=>m.tipo==='entrada'), dir = movs.filter(m=>m.tipo==='entrada_direta');

  let h = '<div class="kpi-grid" style="grid-template-columns:repeat(3,1fr)">'+
    kpi('green','fa-warehouse','No galpão', String(gal.length), money(gal.reduce((s,m)=>s+numRaw(m.valorTotal),0)))+
    kpi('amber','fa-truck-ramp-box','Direto na obra', String(dir.length), money(dir.reduce((s,m)=>s+numRaw(m.valorTotal),0)))+
    kpi('navy','fa-coins','Total geral', String(movs.length), money(tot))+
  '</div>';

  /* por fornecedor */
  const pf={};
  movs.forEach(m=>{ if(!m.fornecedorId) return; pf[m.fornecedorId]=(pf[m.fornecedorId]||0)+numRaw(m.valorTotal); });
  const pfArr=Object.keys(pf).map(k=>({k:nomeForn(k),v:pf[k]})).sort((a,b)=>b.v-a.v);
  const maxPf=pfArr.length?pfArr[0].v:1;
  h += '<div class="card" style="margin-bottom:16px"><div class="card-head"><h3><i class="fa-solid fa-truck-field"></i>Compras por fornecedor</h3></div><div class="card-pad">';
  if(!pfArr.length) h+='<p class="muted" style="font-size:13px">Sem dados.</p>';
  else pfArr.forEach(p=>h+='<div class="barh"><div class="bh-label">'+esc(p.k)+'</div><div class="bh-track">'+
    '<div class="bh-fill g" style="width:'+((p.v/maxPf)*100).toFixed(0)+'%"></div></div><div class="bh-val">'+moneyShort(p.v)+'</div></div>');
  h += '</div></div>';

  h += '<div class="card"><div class="card-head"><h3><i class="fa-solid fa-list"></i>Detalhamento das entradas</h3>'+
    '<button class="btn btn-outline btn-sm" onclick="Reports.exportMovCSV(\'entrada\')"><i class="fa-solid fa-file-csv"></i> CSV</button></div>'+
    '<div class="scroll-x"><table style="min-width:680px"><thead><tr><th>Data</th><th>Tipo</th><th>Material</th><th class="num">Qtd.</th>'+
    '<th>Fornecedor</th><th>NF</th><th>Destino</th><th class="num">Valor</th></tr></thead><tbody>';
  movs.slice(0,200).forEach(m=>{
    h += '<tr onclick="Views.movDetalhe(\''+m.id+'\')"><td class="tabular tsub">'+fmtDate(m.data)+'</td>'+
      '<td>'+(m.tipo==='entrada'?'<span class="badge b-green">Galpão</span>':'<span class="badge b-amber">Direta</span>')+'</td>'+
      '<td class="tm">'+esc(m.materialDesc)+'</td><td class="num">'+qty(m.quantidade)+' <span class="tsub">'+esc(m.unidade)+'</span></td>'+
      '<td class="tsub">'+(m.fornecedorId?esc(nomeForn(m.fornecedorId)):'—')+'</td><td class="tsub tabular">'+esc(m.nfNumero||'—')+'</td>'+
      '<td class="tsub">'+esc(m.destino||'—')+'</td><td class="num tabular" style="font-weight:700">'+money(m.valorTotal)+'</td></tr>';
  });
  h += '</tbody></table></div></div>';
  return h;
};

Reports.saidas = function(){
  const movs = DB.movimentacoes.all().filter(m=>m.tipo==='saida').sort((a,b)=>b.data.localeCompare(a.data));
  const devs = DB.movimentacoes.all().filter(m=>m.tipo==='devolucao');
  const totDev = devs.reduce((s,m)=>s+numRaw(m.valorTotal),0);
  const tot = movs.reduce((s,m)=>s+numRaw(m.valorTotal),0) - totDev;
  const mesAtual = movs.filter(m=>monthKey(m.data)===curMonth());

  let h = '<div class="kpi-grid" style="grid-template-columns:repeat(3,1fr)">'+
    kpi('blue','fa-arrow-up','Saídas (líquidas)', String(movs.length), money(tot))+
    kpi('navy','fa-calendar-day','No mês atual', String(mesAtual.length), money(mesAtual.reduce((s,m)=>s+numRaw(m.valorTotal),0)))+
    kpi('green','fa-rotate-left','Devolvido', String(devs.length), money(totDev))+
  '</div>';

  const po={};
  movs.forEach(m=>{ if(!m.obraId) return; po[m.obraId]=(po[m.obraId]||0)+numRaw(m.valorTotal); });
  devs.forEach(m=>{ if(!m.obraId) return; po[m.obraId]=(po[m.obraId]||0)-numRaw(m.valorTotal); });
  const poArr=Object.keys(po).map(k=>({k:nomeObra(k),v:po[k]})).sort((a,b)=>b.v-a.v);
  const maxPo=poArr.length?poArr[0].v:1;
  h += '<div class="card" style="margin-bottom:16px"><div class="card-head"><h3><i class="fa-solid fa-building-flag"></i>Saídas por obra</h3></div><div class="card-pad">';
  if(!poArr.length) h+='<p class="muted" style="font-size:13px">Sem dados.</p>';
  else poArr.forEach(p=>h+='<div class="barh"><div class="bh-label">'+esc(p.k)+'</div><div class="bh-track">'+
    '<div class="bh-fill" style="width:'+((p.v/maxPo)*100).toFixed(0)+'%"></div></div><div class="bh-val">'+moneyShort(p.v)+'</div></div>');
  h += '</div></div>';

  h += '<div class="card"><div class="card-head"><h3><i class="fa-solid fa-list"></i>Detalhamento das saídas</h3>'+

/* ---- Exportações CSV ---- */
function csvEsc(v){ const s=String(v==null?'':v); return '"'+s.replace(/"/g,'""')+'"'; }
function toCSV(headers, rows){
  return '\uFEFF'+[headers.map(csvEsc).join(';')].concat(rows.map(r=>r.map(csvEsc).join(';'))).join('\r\n');
}
Reports.exportEstoqueCSV = function(){
  const rows = Stock.rows().map(r=>[r.codigo,r.descricao,r.categoria,r.unidade,r.saldo,r.minimo,r.ideal,
    r.custo.toFixed(2).replace('.',','), r.valorTotal.toFixed(2).replace('.',','), Stock.statusLabel(r.status)]);
  download('estoque_'+todayISO()+'.csv',
    toCSV(['Código','Material','Categoria','Unidade','Estoque atual','Estoque mínimo','Estoque ideal','Custo médio','Valor total','Status'],rows),
    'text/csv;charset=utf-8');
  Toast.ok('Arquivo exportado.','estoque_'+todayISO()+'.csv');
};
Reports.exportMovCSV = function(tipo){

    m.materialDesc||nomeMat(m.materialId), m.quantidade, m.unidade, m.origem||'', m.destino||'',

    numRaw(m.valorUnitario).toFixed(2).replace('.',','), numRaw(m.valorTotal).toFixed(2).replace('.',','),
    m.responsavel||'', m.observacao||'']);
  download('movimentacoes_'+todayISO()+'.csv',
    toCSV(['Data','Tipo','Material','Quantidade','Unidade','Origem','Destino','Obra','Fornecedor','NF','Valor unit.','Valor total','Responsável','Observação'],rows),
    'text/csv;charset=utf-8');

};

Reports.exportComprasCSV = function(){

    r.mat.fornecedorId?nomeForn(r.mat.fornecedorId):'', r.saldo, r.minimo, r.ideal, r.repor, r.unidade,

};

<script>
/* ==========================================================================
   PWA — instalação, atalhos e atualização
   Escopo: aplicativo instalável. O service worker cacheia apenas o shell;
   não há fila de escrita offline (conexão do galpão é boa).
   ========================================================================== */
const PWA = {
  deferred:null,

  init(){
    this.registrarSW();
    this.prepararInstalacao();
    this.tratarAtalhos();
  },

  /* ---------- Service Worker ---------- */
  registrarSW(){
    if(!('serviceWorker' in navigator)) return;
    // file:// não suporta SW — o app continua funcionando, só não instala.
    if(location.protocol === 'file:'){
      console.info('[PWA] Service Worker requer http(s). Em file:// o app funciona normalmente, mas não é instalável.');
      return;
    }
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').then(reg=>{
        // Detecta nova versão publicada e oferece atualizar
        reg.addEventListener('updatefound', ()=>{
          const sw = reg.installing;
          if(!sw) return;
          sw.addEventListener('statechange', ()=>{
            if(sw.state==='installed' && navigator.serviceWorker.controller){
              PWA.avisarAtualizacao(reg);
            }
          });
        });
      }).catch(e=>console.warn('[PWA] SW não registrado:',e));

      let recarregando=false;
      navigator.serviceWorker.addEventListener('controllerchange', ()=>{
        if(recarregando) return; recarregando=true; location.reload();
      });
    });
  },

  avisarAtualizacao(reg){
    if($('#updateBar')) return;
    const bar=document.createElement('div');
    bar.className='update-bar'; bar.id='updateBar';
    bar.innerHTML='<i class="fa-solid fa-arrows-rotate"></i>'+
      '<span>Nova versão disponível.</span>'+
      '<button id="btnUpdate">Atualizar</button>';
    document.body.appendChild(bar);
    $('#btnUpdate').addEventListener('click',()=>{
      if(reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
      bar.remove();
    });
  },

  /* ---------- Instalação ---------- */
  prepararInstalacao(){
    const btns = ['#sbInstall','#btnInstallTop'];

    // Android/Chrome/Edge: evento nativo
    window.addEventListener('beforeinstallprompt', e=>{
      e.preventDefault();
      this.deferred = e;
      btns.forEach(sel=>{ const b=$(sel); if(b) b.classList.remove('hide'); });
    });

    btns.forEach(sel=>{
      const b=$(sel); if(!b) return;
      b.addEventListener('click', ()=>this.instalar());
    });

    window.addEventListener('appinstalled', ()=>{
      this.deferred=null;
      btns.forEach(sel=>{ const b=$(sel); if(b) b.classList.add('hide'); });
      try{ localStorage.setItem('obrastock:instalado','1'); }catch(e){}
      Toast.ok('Aplicativo instalado.','Abra pelo ícone na tela inicial.');
    });

    // iOS: não há prompt — mostramos instruções uma única vez
    if(this.ehIOS() && !this.estaInstalado()){
      let jaViu=false;
      try{ jaViu = localStorage.getItem('obrastock:dica-ios')==='1'; }catch(e){}
      if(!jaViu) setTimeout(()=>this.dicaIOS(), 2600);
    }
  },

  instalar(){
    if(this.deferred){
      this.deferred.prompt();
      this.deferred.userChoice.then(r=>{
        if(r.outcome!=='accepted') Toast.info('Instalação cancelada.','Você pode instalar depois pelo menu do navegador.');
        this.deferred=null;
      });
    } else if(this.ehIOS()){
      this.dicaIOS(true);
    } else {
      Toast.info('Instalação pelo navegador','Use o menu do navegador e escolha "Instalar aplicativo".');
    }
  },

  dicaIOS(forcar){
    if($('#iosSheet')) return;
    const el=document.createElement('div');
    el.className='ios-sheet'; el.id='iosSheet';
    el.innerHTML=
      '<button class="close" id="iosClose"><i class="fa-solid fa-xmark"></i></button>'+
      '<h4><i class="fa-solid fa-helmet-safety"></i>Instale o ObraStock</h4>'+
      '<p>Adicione à tela de início para abrir como aplicativo, em tela cheia.</p>'+
      '<div class="steps">'+
        '<div class="step"><b class="n">1</b><span class="txt"><i class="fa-solid fa-arrow-up-from-bracket"></i> Toque em <b>Compartilhar</b></span></div>'+
        '<div class="step"><b class="n">2</b><span class="txt"><i class="fa-solid fa-square-plus"></i> Escolha <b>Adicionar à Tela de Início</b></span></div>'+
        '<div class="step"><b class="n">3</b><span class="txt"><i class="fa-solid fa-check"></i> Confirme em <b>Adicionar</b></span></div>'+
      '</div>';
    document.body.appendChild(el);
    $('#iosClose').addEventListener('click',()=>{
      el.remove();
      if(!forcar){ try{ localStorage.setItem('obrastock:dica-ios','1'); }catch(e){} }
    });
  },

  ehIOS(){
    const ua=navigator.userAgent;
    // iPadOS moderno se identifica como Mac; detecta pelo touch
    return /iphone|ipad|ipod/i.test(ua) ||
           (/Macintosh/.test(ua) && navigator.maxTouchPoints>1);
  },

  estaInstalado(){
    return window.matchMedia('(display-mode: standalone)').matches ||
           window.navigator.standalone === true;
  },

  /* ---------- Atalhos do manifest (?acao= / ?tela=) ---------- */
  tratarAtalhos(){
    let p;
    try{ p = new URLSearchParams(location.search); }catch(e){ return; }
    const acao=p.get('acao'), tela=p.get('tela');
    if(!acao && !tela) return;
    // limpa a URL para o atalho não repetir ao recarregar
    try{ history.replaceState(null,'',location.pathname); }catch(e){}
    setTimeout(()=>{
      if(tela && Views[tela]) App.go(tela);
      if(acao==='saida') Forms.novaSaida();
      else if(acao==='entrada') Forms.novaEntrada();
      else if(acao==='xml') Forms.importarXML();
      else if(acao==='devolucao') Forms.novaDevolucao();
      else if(acao==='ajuste') Forms.novoAjuste();
    }, 260);
  }
};
</script>

Views.contrato_init = async function(){
  const slot = $('#ctSlot'); if(!slot) return;
  const g = G();
  let c = CONTRATO_PADRAO;

  if (g){
    try{
      const vindo = await g.Cobranca.contrato();
      if (vindo) c = vindo;
    }catch(e){ /* sem conexão: segue com o padrão, a tela não pode quebrar */ }
  }
  /* Pagamento: a cobranca em aberto e os dados de recebimento. Nenhum dos
     dois pode derrubar a tela do contrato — se falharem, a pagina continua
     mostrando o plano, apenas sem o bloco de pagamento. */
  let aberta = null, cfg = null;
  if (g){
    try{ aberta = await g.Cobranca.minhaCobrancaAberta(); }catch(e){}
    try{ cfg    = await g.Cobranca.configRecebimento(); }catch(e){}
  }

  slot.innerHTML = contratoHTML(c) + pagamentoHTML(aberta, cfg) + valorEntregueHTML();
  ligarValorEntregue();
  ligarPagamento(aberta, cfg);
};

/* --------------------------------------------------------------------------
   PAGAMENTO — PIX COPIA E COLA
   O codigo e montado no navegador a partir da chave, do nome e do valor da
   cobranca. Nao depende de banco, de integracao nem de internet alem da
   propria pagina.
   -------------------------------------------------------------------------- */
function pagamentoHTML(cob, cfg){
  if (!cob) return '';                       // nada em aberto: nada a cobrar

  const hoje = todayISO();
  const atrasada = cob.vencimento < hoje;
  const semChave = !cfg || !cfg.chave_pix;
  const semNome  = !cfg || !String(cfg.beneficiario || '').trim();

  let corpo;
  if (semChave || semNome){
    /* Melhor nao mostrar nada do que mostrar um codigo que o banco recusa.
       O aviso e dirigido a quem administra, nao ao cliente. */
    corpo = '<div class="alert a-amber"><i class="fa-solid fa-triangle-exclamation"></i><div>'+
      'Os dados de recebimento ainda não foram preenchidos. '+
      (ehDevUI() ? 'Abra <b>Cobrança → Dados de recebimento</b> e complete o '+
                   (semChave?'<b>chave PIX</b>':'<b>nome do recebedor</b>')+'.'
                 : 'Fale com o suporte para combinar o pagamento.')+
      '</div></div>';
  } else {
    let codigo = '';
    try{
      codigo = window.Pix.gerarBRCode({
        chave:  cfg.chave_pix,
        nome:   cfg.beneficiario,
        cidade: cfg.cidade,
        valor:  cob.valor,
        txid:   window.Pix.txidDaCobranca(cob.competencia, cob.empresa_id)
      });
    }catch(e){
      return '<div class="card" style="margin-bottom:14px"><div class="card-pad">'+
        '<div class="alert a-red"><i class="fa-solid fa-circle-exclamation"></i><div>'+
        'Não foi possível montar o código PIX: '+esc(e.message)+'</div></div></div></div>';
    }

    corpo =
      '<div class="field" style="margin-bottom:10px"><label>PIX copia e cola</label>'+
        '<textarea class="input" id="pxCodigo" rows="3" readonly '+
          'style="font-family:ui-monospace,monospace;font-size:11.5px;word-break:break-all">'+
          esc(codigo)+'</textarea></div>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
        '<button class="btn btn-primary" id="pxCopiar"><i class="fa-solid fa-copy"></i> Copiar código PIX</button>'+
        (cfg.link_pagamento
          ? '<a class="btn btn-outline" href="'+esc(cfg.link_pagamento)+'" target="_blank" rel="noopener">'+
            '<i class="fa-solid fa-arrow-up-right-from-square"></i> Pagar pelo banco</a>'
          : '')+
      '</div>'+
      '<p class="hint" style="margin-top:10px">Abra o aplicativo do seu banco, escolha '+
        '<b>PIX → Copia e cola</b> e cole o código. O valor já vai junto.</p>';
  }

  return '<div class="card" style="margin-bottom:14px">'+
    '<div class="card-head"><h3><i class="fa-brands fa-pix"></i>Pagamento em aberto</h3>'+
      '<span class="badge '+(atrasada?'b-red':'b-amber')+'">'+(atrasada?'atrasada':'em aberto')+'</span>'+
    '</div><div class="card-pad">'+
      '<div style="display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px">'+
        '<div style="font-size:26px;font-weight:800">'+money(cob.valor)+'</div>'+
        '<div style="color:var(--muted);font-size:13px">'+esc(mesLabel(cob.competencia))+
          ' · vence '+fmtDate(cob.vencimento)+'</div>'+
      '</div>'+ corpo +
    '</div></div>';
}

function ligarPagamento(cob, cfg){
  const bt = $('#pxCopiar'), campo = $('#pxCodigo');
  if (!bt || !campo) return;
  bt.addEventListener('click', async ()=>{
    const texto = campo.value;
    let ok = false;
    try{ await navigator.clipboard.writeText(texto); ok = true; }
    catch(e){
      /* clipboard exige contexto seguro; a selecao manual sempre funciona */
      try{ campo.select(); ok = document.execCommand('copy'); }catch(e2){ ok = false; }
    }
    if (ok){
      const antes = bt.innerHTML;
      bt.innerHTML = '<i class="fa-solid fa-check"></i> Copiado';
      setTimeout(()=>{ bt.innerHTML = antes; }, 2000);
    } else {
      campo.select();
      Toast.err('Copie manualmente','Selecione o código acima e copie.');
    }
  });
}

function contratoHTML(c){
  const hoje = new Date();
  const dia  = c.dia_vencimento || 10;
  let venc = new Date(hoje.getFullYear(), hoje.getMonth(), dia);
  if (venc < hoje) venc = new Date(hoje.getFullYear(), hoje.getMonth()+1, dia);
  const faltam = Math.round((venc - hoje)/86400000);

  const st = String(c.status||'ativo');
  const badge = st==='ativo' ? 'b-green' : (st==='suspenso' ? 'b-amber' : 'b-red');
  const itens = Array.isArray(c.inclui) && c.inclui.length ? c.inclui : CONTRATO_PADRAO.inclui;

  let h = '<div class="card" style="margin-bottom:14px;overflow:hidden">'+
    '<div style="background:var(--navy);color:#fff;padding:18px 16px">'+
      '<div style="display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap">'+
        '<div style="flex:1;min-width:180px">'+
          '<div style="font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#9fb6d1;font-weight:700">Sustentação mensal</div>'+
          '<div style="font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1.1;margin-top:2px">'+money(c.valor_mensal)+
            '<span style="font-size:14px;font-weight:600;color:#9fb6d1">/mês</span></div>'+
        '</div>'+
        '<span class="badge '+badge+'" style="margin-top:6px">'+st.toUpperCase()+'</span>'+
      '</div>'+
    '</div>'+
    '<div class="card-pad">'+
      '<div class="kpi-grid" style="margin-bottom:12px">'+
        '<div class="kpi k-blue"><div class="kl">Próximo vencimento</div>'+
          '<div class="kv" style="font-size:17px">dia '+dia+'</div>'+
          '<div class="kd">'+(faltam===0?'é hoje':'em '+faltam+' dia'+(faltam>1?'s':''))+'</div></div>'+
        '<div class="kpi k-green"><div class="kl">Custo por dia</div>'+
          '<div class="kv" style="font-size:17px">'+money((c.valor_mensal||350)/30)+'</div>'+
          '<div class="kd">menos que um café</div></div>'+
      '</div>'+
      '<div style="font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:8px">O que está incluído</div>'+
      '<div style="display:grid;gap:7px">';

  itens.forEach(i=>{
    h += '<div style="display:flex;gap:9px;align-items:flex-start;font-size:13.5px">'+
         '<i class="fa-solid fa-circle-check" style="color:var(--green);margin-top:3px;flex-shrink:0"></i>'+
         '<span>'+esc(i)+'</span></div>';
  });

  h += '</div>';

  if (c.valor_implantacao){
    h += '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)">'+
         'Implantação de '+money(c.valor_implantacao)+' — <b>já quitada</b>, pagamento único.</div>';
  }
  h += '<div style="margin-top:12px;padding:10px 12px;background:var(--bg-soft,rgba(0,0,0,.03));border-radius:10px;font-size:12.5px;color:var(--muted);line-height:1.55">'+
       '<i class="fa-solid fa-circle-info"></i> Sem fidelidade e sem multa. Você pode encerrar quando quiser e leva uma cópia completa dos seus dados.</div>';
  h += '</div></div>';
  return h;
}

/* --------------------------------------------------------------------------
   RELATÓRIO DE VALOR ENTREGUE

function valorEntregueHTML(){
  return '<div class="card"><div class="card-head">'+
    '<h3><i class="fa-solid fa-chart-line"></i>O que o sistema entregou</h3>'+
    '<input type="month" class="input" id="veMes" style="width:auto;max-width:170px" value="'+competenciaAtual()+'">'+
    '</div><div class="card-pad" id="veCorpo"></div></div>';
}

function ligarValorEntregue(){
  const campo = $('#veMes'); if(!campo) return;
  const pinta = () => { const el=$('#veCorpo'); if(el) el.innerHTML = veCorpoHTML(campo.value); };
  campo.addEventListener('change', pinta);
  pinta();
}

function veCorpoHTML(mes){
  const g = G();
  const v = g ? g.Cobranca.valorEntregue(mes) : null;
  if (!v) return '<div class="empty">Sem dados para este período.</div>';

  const mensal = 350;
  let h = '<div class="kpi-grid">'+
    '<div class="kpi k-navy"><div class="kl">Movimentações registradas</div><div class="kv">'+v.movimentacoes+'</div>'+
      '<div class="kd">'+v.entradas+' entradas · '+v.saidas+' saídas</div></div>'+
    '<div class="kpi k-blue"><div class="kl">Valor sob controle</div><div class="kv" style="font-size:17px">'+moneyShort(v.valorEstoque)+'</div>'+
      '<div class="kd">'+v.itensControlados+(v.itensControlados===1?' item':' itens')+' no galpão</div></div>'+
    '<div class="kpi k-green"><div class="kl">Devolvido da obra</div><div class="kv" style="font-size:17px">'+moneyShort(v.valorDevolvido)+'</div>'+
      '<div class="kd">'+v.devolucoes+(v.devolucoes===1?' devolução':' devoluções')+' · material que não virou perda</div></div>'+
    '<div class="kpi k-amber"><div class="kl">Alertas de reposição</div><div class="kv">'+v.alertas+'</div>'+
      '<div class="kd">'+moneyShort(v.valorReposicao)+' a repor</div></div>'+
    '</div>';

  h += '<div class="scroll-x"><table style="min-width:420px"><thead><tr>'+
       '<th>Movimento</th><th class="num">Qtde</th><th class="num">Valor</th></tr></thead><tbody>'+
       linhaVE('Entradas no galpão', v.entradas, v.valorEntradas)+
       linhaVE('Saídas para obras', v.saidas, v.valorSaidas)+
       linhaVE('Entregas diretas na obra', v.diretas, v.valorDiretas)+
       linhaVE('Devoluções ao galpão', v.devolucoes, v.valorDevolvido)+
       '<tr style="font-weight:800;border-top:2px solid var(--line)">'+
         '<td>Volume total movimentado</td><td class="num">'+v.movimentacoes+'</td>'+
         '<td class="num">'+money(v.volumeTotal)+'</td></tr>'+
       '</tbody></table></div>';

  /* A conta que importa na renovação. */
  if (v.volumeTotal > 0){
    const pct = (mensal / v.volumeTotal) * 100;
    h += '<div style="margin-top:14px;padding:13px 14px;border-radius:12px;background:rgba(22,163,74,.08);border:1px solid rgba(22,163,74,.25)">'+
      '<div style="font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--green);margin-bottom:5px">'+
        '<i class="fa-solid fa-scale-balanced"></i> Custo x volume controlado</div>'+
      '<div style="font-size:13.5px;line-height:1.6">Em '+mesLabel(mes+'-01')+', o sistema controlou <b>'+money(v.volumeTotal)+
      '</b> em material movimentado. A mensalidade de <b>'+money(mensal)+'</b> equivale a <b>'+
      pct.toLocaleString('pt-BR',{maximumFractionDigits:2})+'%</b> desse valor'+
      (v.valorDevolvido>0 ? '. Só as devoluções registradas somaram <b>'+money(v.valorDevolvido)+
       '</b> — material que, sem controle, costuma sumir na obra.' : '.')+'</div></div>';
  }

  h += '<div class="kpi-grid" style="margin-top:12px">'+
    '<div class="kpi k-blue"><div class="kl">Obras acompanhadas</div><div class="kv">'+v.obras+'</div><div class="kd">em andamento</div></div>'+
    '<div class="kpi k-navy"><div class="kl">Notas no período</div><div class="kv">'+v.notas+'</div><div class="kd">documentos arquivados</div></div>'+
    '</div>';

  h += '<div style="margin-top:12px;font-size:12px;color:var(--muted);line-height:1.55">'+
    'Números apurados a partir dos lançamentos do próprio período — nada é estimado. '+
    'Backups diários e monitoramento de disponibilidade rodam de forma automática e estão inclusos.</div>';
  return h;
}

function linhaVE(rot, qtd, val){
  return '<tr><td>'+rot+'</td><td class="num">'+qtd+'</td><td class="num">'+money(val)+'</td></tr>';
}

Views.usuarios_init = async function(){
  if (!ehDevUI()) return;
  const g = G(); if(!g) return;

  try{
    const r = await g.Usuarios.empresas();
    const sel = $('#usEmp');
    (r.empresas||[]).forEach(e=>{
      const o=document.createElement('option'); o.value=e.id; o.textContent=e.nome; sel.appendChild(o);
    });
  }catch(e){ Toast.err(e.message); }

  $('#usEmp').addEventListener('change', carregarUsuarios);
  $('#usNovo').addEventListener('click', ()=>formUsuario(null));
  carregarUsuarios();
};

async function carregarUsuarios(){
  const alvo = $('#usLista'); if(!alvo) return;
  const g = G();
  try{
    const r = await g.Usuarios.listar($('#usEmp').value || null);
    const us = r.usuarios || [];
    if (!us.length){ alvo.innerHTML = '<div class="card"><div class="card-pad"><div class="empty">Nenhum usuário.</div></div></div>'; return; }

    let cards = '<div class="list">';
    us.forEach(u=>{
      const cor = u.papel==='admin'?'b-blue':(u.papel==='estoquista'?'b-green':'b-gray');
      cards += '<div class="item" style="display:flex;gap:12px;align-items:center;cursor:default'+(u.ativo?'':';opacity:.55')+'">'+
        '<div style="flex:1;min-width:0">'+
          '<div style="font-weight:700">'+esc(u.nome||'—')+
            (u.ativo?'':' <span class="badge b-red">inativo</span>')+'</div>'+
          '<div style="font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis">'+esc(u.email||'')+'</div>'+
          '<div style="font-size:11.5px;color:var(--muted);margin-top:3px">'+esc(u.empresaNome||'')+
            (u.cargo?' · '+esc(u.cargo):'')+'</div>'+
        '</div>'+
        '<div style="display:flex;align-items:center;gap:10px;flex-shrink:0">'+
          '<span class="badge '+cor+'">'+esc(u.papel)+'</span>'+
          '<button class="btn btn-outline btn-sm" data-edit="'+u.id+'" title="Editar"><i class="fa-solid fa-pen"></i></button>'+
        '</div></div>';
    });
    cards += '</div>';
    alvo.innerHTML = cards;

    alvo.querySelectorAll('[data-edit]').forEach(b=>{
      b.addEventListener('click', ()=>formUsuario(us.find(x=>x.id===b.dataset.edit)));
    });
  }catch(e){
    alvo.innerHTML = '<div class="card"><div class="card-pad"><div class="empty">'+esc(e.message)+'</div></div></div>';
  }
}

function formUsuario(u){
  const novo = !u;
  const opt = (v,r,sel)=>'<option value="'+v+'"'+(sel===v?' selected':'')+'>'+r+'</option>';
  const empSel = $('#usEmp');
  let empresas = '';
  if (empSel) Array.from(empSel.options).forEach(o=>{
    if(!o.value) return;
    empresas += opt(o.value, esc(o.textContent), novo ? (empSel.value||'') : (u.empresa_id||''));
  });

  const corpo =
    '<div class="field"><label>Nome *</label><input class="input" id="fuNome" value="'+esc(novo?'':u.nome||'')+'"></div>'+
    '<div class="field"><label>E-mail *</label><input class="input" id="fuEmail" type="email" '+
      'value="'+esc(novo?'':u.email||'')+'"'+(novo?'':' disabled')+'></div>'+
      (novo?'':'<div style="font-size:11.5px;color:var(--muted);margin:-8px 0 12px">O e-mail não muda depois de criado.</div>')+
    '<div class="grid2">'+
      '<div class="field"><label>Papel *</label><select class="input" id="fuPapel">'+
        opt('admin','Administrador', novo?'admin':u.papel)+
        opt('estoquista','Estoquista', novo?'admin':u.papel)+
        opt('visualizador','Visualizador', novo?'admin':u.papel)+
      '</select></div>'+
      '<div class="field"><label>Cargo</label><input class="input" id="fuCargo" value="'+esc(novo?'':u.cargo||'')+'"></div>'+
    '</div>'+
    '<div class="field"><label>Empresa *</label><select class="input" id="fuEmp">'+
      (novo?'<option value="">Escolha…</option>':'')+empresas+'</select></div>'+
    (novo
      ? '<div style="padding:10px 12px;background:rgba(37,99,235,.08);border-radius:10px;font-size:12.5px;line-height:1.55">'+
        '<i class="fa-solid fa-link"></i> Ao salvar, o sistema mostra um <b>link de primeiro acesso</b> '+
        'para você enviar por WhatsApp. A pessoa abre e escolhe a própria senha.</div>'
      : '<label class="chk" style="display:flex;gap:8px;align-items:center;font-size:13.5px;margin-bottom:10px">'+
        '<input type="checkbox" id="fuAtivo"'+(u.ativo?' checked':'')+'> Acesso ativo</label>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
        '<button class="btn btn-outline btn-sm" id="fuConvite"><i class="fa-solid fa-link"></i> Gerar link de acesso</button>'+
        '<button class="btn btn-red btn-sm" id="fuRemover"><i class="fa-solid fa-trash"></i> Remover</button></div>');

  Modal.open({
    title: novo ? 'Novo usuário' : 'Editar usuário',
    icon: novo ? 'fa-user-plus' : 'fa-user-pen',
    body: corpo,
    footer: '<button class="btn btn-outline" data-close>Cancelar</button>'+
            '<button class="btn btn-primary" id="fuSalvar">'+(novo?'Criar acesso':'Salvar')+'</button>',
    onMount: ov=>{
      const g = G();
      const salvar = async ()=>{
      const dados = {
        nome:  $('#fuNome', ov).value.trim(),
        cargo: $('#fuCargo', ov).value.trim(),
        papel: $('#fuPapel', ov).value,
        empresaId: $('#fuEmp', ov).value
      };
      if (!dados.nome)      { Toast.err('Informe o nome.'); return; }
      if (!dados.empresaId) { Toast.err('Escolha a empresa.'); return; }

      const bt = $('#fuSalvar', ov);
      bt.disabled = true; bt.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Salvando…';
      try{
        if (novo){
          dados.email = $('#fuEmail', ov).value.trim();
          if (!dados.email) throw new Error('Informe o e-mail.');
          const r = await g.Usuarios.criar(dados);
          Toast.ok(r.avisoEmail || 'Usuário criado. Convite enviado por e-mail.');
        }else{
          dados.id = u.id;
          dados.ativo = $('#fuAtivo', ov).checked;
          await g.Usuarios.atualizar(dados);
          Toast.ok('Usuário atualizado.');
        }
        Modal.close();
        carregarUsuarios();
      }catch(e){
        Toast.err(e.message);
        bt.disabled = false; bt.textContent = novo ? 'Criar acesso' : 'Salvar';
      }
      };
      $('#fuSalvar', ov).addEventListener('click', salvar);

      if (novo) return;
      const bc=$('#fuConvite', ov), br=$('#fuRemover', ov);
      if (bc) bc.addEventListener('click', async ()=>{
        const antes=bc.innerHTML; bc.disabled=true;
        bc.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Gerando...';
        try{
          const r = await g.Usuarios.convite(u.email);
          Modal.close();
          mostrarLinkAcesso(u.nome||'o usuário', u.email, r && r.link);
        }catch(e){ Toast.err('Não foi possível gerar o link', e.message); }
        finally{ bc.disabled=false; bc.innerHTML=antes; }
      });
      if (br) br.addEventListener('click', ()=>{
        Modal.confirm('Remover '+(u.nome||'usuário')+'?',
          'O acesso é apagado em definitivo. O histórico de movimentações continua.',
          async ()=>{
            try{ await g.Usuarios.remover(u.id); Toast.ok('Usuário removido.'); Modal.close(); carregarUsuarios(); }

Views.cobranca_init = async function(){
  if (!ehDevUI()) return;
  const g=G(); if(!g) return;
  try{
    const r = await g.Usuarios.empresas();
    const sel=$('#cbEmp');
    sel.innerHTML='<option value="">Todas</option>';   // nunca empilhar opções
    (r.empresas||[]).forEach(e=>{ const o=document.createElement('option'); o.value=e.id; o.textContent=e.nome; sel.appendChild(o); });
  }catch(e){ Toast.err(e.message); }

  $('#cbEmp').addEventListener('change', carregarCobrancas);
  $('#cbGerar').addEventListener('click', async ()=>{
    const emp=$('#cbEmp').value;
    if(!emp){ Toast.err('Escolha a empresa para gerar.'); return; }
    try{ await g.Cobranca.gerarMes(emp); Toast.ok('Cobrança gerada.'); carregarCobrancas(); }
    catch(e){ Toast.err(e.message); }
  });
  $('#cbGerarTodos').addEventListener('click', async ()=>{
    const bt=$('#cbGerarTodos'); const antes=bt.innerHTML;
    bt.disabled=true; bt.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Gerando...';
    try{
      const r = await g.Cobranca.gerarTodos();
      const criadas = r.filter(x=>x.situacao==='criada').length;
      const tinha   = r.length - criadas;
      if(!r.length) Toast.err('Nenhum contrato ativo','Não há cliente para cobrar neste mês.');
      else Toast.ok(criadas+(criadas===1?' cobrança gerada':' cobranças geradas'),
                    tinha? tinha+(tinha===1?' já existia e foi mantida.':' já existiam e foram mantidas.')
                         : 'Todos os contratos ativos do mês.');
      carregarCobrancas();
    }catch(e){ Toast.err('Não foi possível gerar', e.message); }
    finally{ bt.disabled=false; bt.innerHTML=antes; }
  });
  $('#cbNovo').addEventListener('click', formNovoCliente);
  $('#cbReceb').addEventListener('click', formRecebimento);
  $('#cbContrato').addEventListener('click', ()=>{
    const emp=$('#cbEmp').value;
    if(!emp){ Toast.err('Escolha a empresa','Selecione de quem é o contrato que você quer ver.'); return; }
    formContrato(emp, $('#cbEmp').selectedOptions[0].textContent);
  });
  carregarCobrancas();
};

/* ---------------------------------------------------------------------------
   DADOS DE RECEBIMENTO
   Chave PIX, nome e cidade do recebedor. É daqui que sai o código que o
   cliente copia para pagar.
--------------------------------------------------------------------------- */
async function formRecebimento(){
  const g=G(); if(!g) return;
  let cfg=null;
  try{ cfg = await g.Cobranca.configRecebimento(); }
  catch(e){ Toast.err('Não foi possível ler os dados', e.message); return; }
  cfg = cfg || {};

  const b =
    '<div class="field"><label>Chave PIX <span class="req">*</span></label>'+
      '<input class="input" id="rcChave" value="'+esc(cfg.chave_pix||'')+'" '+
      'placeholder="CPF, CNPJ, e-mail, telefone ou chave aleatória"></div>'+
    '<div class="grid2">'+
      '<div class="field"><label>Nome do recebedor <span class="req">*</span></label>'+
        '<input class="input" id="rcNome" maxlength="25" value="'+esc(cfg.beneficiario||'')+'" '+
        'placeholder="Como aparece na sua conta"></div>'+
      '<div class="field"><label>Cidade</label>'+
        '<input class="input" id="rcCidade" maxlength="15" value="'+esc(cfg.cidade||'')+'"></div>'+
    '</div>'+
    '<p class="hint">O padrão do PIX limita o nome a 25 caracteres e a cidade a 15, '+
      'sem acento. O sistema ajusta sozinho — o que você digitar além disso é cortado.</p>'+
    '<div class="field"><label>Link de pagamento do banco (opcional)</label>'+
      '<input class="input" id="rcLink" value="'+esc(cfg.link_pagamento||'')+'" '+
      'placeholder="https://..."></div>'+
    '<p class="hint">Aparece como um segundo botão, para quem prefere pagar pelo site do banco.</p>'+
    '<div class="form-sec">Como vai ficar</div>'+
    '<div id="rcPreview"></div>';

  Modal.open({
    title:'Dados de recebimento', icon:'fa-pix', wide:true, body:b,
    footer:'<button class="btn btn-outline" data-close>Cancelar</button>'+
           '<button class="btn btn-primary" id="rcSalvar"><i class="fa-solid fa-check"></i> Salvar</button>',
    onMount:ov=>{
      /* Pré-visualizar evita o erro mais caro aqui: descobrir que o código
         não presta só quando o cliente tentar pagar. */
      const pintar = ()=>{
        const alvo=$('#rcPreview',ov);
        try{
          const codigo = window.Pix.gerarBRCode({
            chave:$('#rcChave',ov).value.trim(), nome:$('#rcNome',ov).value.trim(),
            cidade:$('#rcCidade',ov).value.trim(), valor:350, txid:'EXEMPLO'
          });
          alvo.innerHTML = '<p class="hint" style="margin-top:0">Exemplo com R$ 350,00:</p>'+
            '<textarea class="input" rows="3" readonly style="font-family:ui-monospace,monospace;'+
            'font-size:11px;word-break:break-all">'+esc(codigo)+'</textarea>';
        }catch(e){
          alvo.innerHTML = '<div class="alert a-amber"><i class="fa-solid fa-triangle-exclamation"></i>'+
            '<div>'+esc(e.message)+'</div></div>';
        }
      };
      ['rcChave','rcNome','rcCidade'].forEach(id=>
        $('#'+id,ov).addEventListener('input', pintar));
      pintar();

      $('#rcSalvar',ov).addEventListener('click', async ()=>{
        const chave=$('#rcChave',ov).value.trim(), nome=$('#rcNome',ov).value.trim();
        if(!chave){ Toast.err('Informe a chave PIX'); return; }
        if(!nome){ Toast.err('Informe o nome do recebedor','É ele que aparece para o cliente conferir antes de pagar.'); return; }
        try{
          await g.Cobranca.salvarConfigRecebimento({
            chave_pix:chave, beneficiario:nome,
            cidade:$('#rcCidade',ov).value.trim()||null,
            link_pagamento:$('#rcLink',ov).value.trim()||null
          });
          Modal.close(); Toast.ok('Dados de recebimento salvos.');
        }catch(e){ Toast.err('Não foi possível salvar', e.message); }
      });
    }
  });
}

/* ---------------------------------------------------------------------------
   LINK DE PRIMEIRO ACESSO
   Mostra o link para o desenvolvedor copiar e mandar por WhatsApp.

   Não enviamos e-mail: o serviço embutido do Supabase entrega no máximo 2
   mensagens por hora e só para membros da organização do projeto — para o
   e-mail do cliente, a mensagem nunca saía, e sem erro visível.
--------------------------------------------------------------------------- */
function mostrarLinkAcesso(nome, email, link){
  if(!link){
    Toast.err('O link não veio','Tente "Gerar link de acesso" na tela de Usuários.');
    return;
  }
  const msg = 'Olá! Seu acesso ao ObraStock está pronto. Abra o link abaixo para '+
              'criar sua senha:\n\n'+link;

  Modal.open({
    title:'Link de primeiro acesso', icon:'fa-link', wide:true,
    body:
      '<p style="margin-top:0">Envie este link para <b>'+esc(nome)+'</b>'+
        (email?' ('+esc(email)+')':'')+'. Ao abrir, a pessoa escolhe a própria senha.</p>'+
      '<div class="field"><label>Link</label>'+
        '<textarea class="input" id="lkTexto" rows="3" readonly '+
          'style="font-family:ui-monospace,monospace;font-size:12px;word-break:break-all">'+
          esc(link)+'</textarea></div>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
        '<button class="btn btn-primary" id="lkCopiar"><i class="fa-solid fa-copy"></i> Copiar link</button>'+
        '<button class="btn btn-outline" id="lkCopiarMsg"><i class="fa-brands fa-whatsapp"></i> Copiar mensagem pronta</button>'+
      '</div>'+
      '<div class="alert a-amber" style="margin-top:14px"><i class="fa-solid fa-clock"></i><div>'+
        'O link vale por tempo limitado (1 hora, no padrão do Supabase). Se expirar, '+
        'abra <b>Usuários</b>, escolha a pessoa e clique em <b>Gerar link de acesso</b> '+
        'para criar outro. Pode gerar quantos precisar.</div></div>',
    footer:'<button class="btn btn-outline" data-close>Fechar</button>',
    onMount:ov=>{
      const campo=$('#lkTexto',ov);
      const copiar = async (texto, botao, rotulo)=>{
        let ok=false;
        try{ await navigator.clipboard.writeText(texto); ok=true; }
        catch(e){
          /* clipboard exige contexto seguro; no http:// do teste e em
             navegador antigo caímos na seleção manual, que sempre funciona */
          try{ campo.value=texto; campo.select(); ok=document.execCommand('copy'); }
          catch(e2){ ok=false; }
          campo.value=link;
        }
        if(ok){
          const antes=botao.innerHTML;
          botao.innerHTML='<i class="fa-solid fa-check"></i> Copiado';
          setTimeout(()=>{ botao.innerHTML=antes; }, 1800);
        } else {
          campo.value=texto; campo.select();
          Toast.err('Copie manualmente','Selecione o texto acima e copie.');
        }
      };
      $('#lkCopiar',ov).addEventListener('click', e=>copiar(link, e.currentTarget));
      $('#lkCopiarMsg',ov).addEventListener('click', e=>copiar(msg, e.currentTarget));
      campo.addEventListener('focus', ()=>campo.select());
    }
  });
}

function formNovoCliente(){
  const g=G(); if(!g) return;
  const hoje = todayISO();
  const b =
    '<div class="form-sec">Empresa</div>'+
    '<div class="field"><label>Razão social <span class="req">*</span></label>'+
      '<input class="input" id="ncNome" placeholder="Ex.: Construtora Fulano Ltda"></div>'+
    '<div class="grid2">'+
      '<div class="field"><label>CNPJ</label><input class="input" id="ncCnpj" inputmode="numeric" placeholder="00.000.000/0001-00"></div>'+
      '<div class="field"><label>Nome do galpão</label><input class="input" id="ncGalpao" value="Galpão Central"></div>'+
    '</div>'+
    '<div class="form-sec">Contrato</div>'+
    '<div class="grid3">'+
      '<div class="field"><label>Mensalidade (R$) <span class="req">*</span></label>'+
        '<input type="number" class="input" id="ncValor" value="350" min="1" step="0.01" inputmode="decimal"></div>'+
      '<div class="field"><label>Dia do vencimento</label>'+
        '<input type="number" class="input" id="ncDia" value="10" min="1" max="28" inputmode="numeric"></div>'+
      '<div class="field"><label>Implantação (R$)</label>'+
        '<input type="number" class="input" id="ncImpl" value="0" min="0" step="0.01" inputmode="decimal"></div>'+
    '</div>'+
    '<div class="field"><label>Início do contrato</label>'+
      '<input type="date" class="input" id="ncInicio" value="'+hoje+'"></div>'+
    '<p class="hint">O vencimento vai do dia 1 ao 28 de propósito: dia 29, 30 ou 31 '+
      'não existe em todo mês e a cobrança cairia em data inválida.</p>'+
    '<div class="form-sec">Primeiro acesso (opcional)</div>'+
    '<div class="grid2">'+
      '<div class="field"><label>Nome do responsável</label><input class="input" id="ncUser" placeholder="Quem vai administrar"></div>'+
      '<div class="field"><label>E-mail</label><input class="input" id="ncEmail" type="email" inputmode="email" placeholder="nome@empresa.com.br"></div>'+
    '</div>'+
    '<p class="hint">Se preencher, o acesso é criado como <b>admin</b> e a pessoa recebe '+
      'um e-mail para definir a própria senha. Ninguém precisa ditar senha por telefone.</p>';

  Modal.open({
    title:'Novo cliente', icon:'fa-building-circle-check', wide:true, body:b,
    footer:'<button class="btn btn-outline" data-close>Cancelar</button>'+
           '<button class="btn btn-primary" id="ncSalvar"><i class="fa-solid fa-check"></i> Cadastrar</button>',
    onMount:ov=>{
      $('#ncSalvar',ov).addEventListener('click', async ()=>{
        const nome=$('#ncNome',ov).value.trim();
        if(!nome){ Toast.err('Informe a razão social'); return; }
        const email=$('#ncEmail',ov).value.trim();
        const userNome=$('#ncUser',ov).value.trim();
        if(email && !userNome){ Toast.err('Informe o nome do responsável','Você preencheu o e-mail mas não o nome.'); return; }
        if(userNome && !email){ Toast.err('Informe o e-mail do responsável','Sem e-mail não dá para criar o acesso.'); return; }

        const bt=$('#ncSalvar',ov);
        bt.disabled=true; bt.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Cadastrando...';
        try{
          const emp = await g.Cobranca.criarCliente({
            nome, cnpj:$('#ncCnpj',ov).value.trim(), galpao:$('#ncGalpao',ov).value.trim(),
            valor:$('#ncValor',ov).value, dia:$('#ncDia',ov).value,
            implantacao:$('#ncImpl',ov).value, inicio:$('#ncInicio',ov).value
          });

          /* O acesso é um segundo passo que pode falhar sozinho (e-mail já
             usado, por exemplo). Se falhar, a empresa e o contrato ficam —
             desfazer tudo obrigaria a redigitar o cadastro inteiro. */
          let aviso='', link=null;
          if(email){
            try{
              const r = await g.Usuarios.criar({ nome:userNome, email, papel:'admin', empresaId:emp.id });
              link = r && r.link;
            }catch(e){
              aviso=' O acesso não foi criado: '+e.message;
            }
          }
          Modal.close();
          if(aviso){ Toast.err('Cliente cadastrado, mas atenção', aviso); }
          else if(link){
            Toast.ok('Cliente cadastrado.');
            /* O link é o passo seguinte do trabalho: mostrar na hora evita
               cadastrar e esquecer de entregar o acesso. */
            mostrarLinkAcesso(userNome, email, link);
          }
          else Toast.ok('Cliente cadastrado.', 'Cadastre o acesso quando quiser.');
          /* App.render() e nao Views.cobranca_init(): o init adiciona
             ouvintes de clique e opcoes ao select. Chamado de novo sobre o
             mesmo HTML, ele duplicava tudo — cada clique em "Contrato"
             passava a abrir dois modais, e a lista de empresas aparecia em
             dobro. Redesenhar a tela cria elementos limpos. */
          App.render();
        }catch(e){
          bt.disabled=false; bt.innerHTML='<i class="fa-solid fa-check"></i> Cadastrar';
          Toast.err('Não foi possível cadastrar', e.message);
        }
      });
    }
  });
}

/* ---------------------------------------------------------------------------
   CONTRATO DE UM CLIENTE
   Ler e ajustar valor, vencimento e situação sem passar pelo SQL.
--------------------------------------------------------------------------- */
async function formContrato(empresaId, nomeEmpresa){
  const g=G(); if(!g) return;
  let c=null;
  try{ c = await g.Cobranca.contrato(empresaId); }
  catch(e){ Toast.err('Não foi possível ler o contrato', e.message); return; }

  const op=(v,t,atual)=>'<option value="'+v+'"'+(atual===v?' selected':'')+'>'+t+'</option>';
  const b =
    '<p class="hint" style="margin-top:0">Cliente: <b>'+esc(nomeEmpresa||'')+'</b></p>'+
    (c?'':'<div class="alert a-amber"><i class="fa-solid fa-triangle-exclamation"></i><div>'+
         'Esta empresa está <b>sem contrato</b>. Enquanto ficar assim, a geração da '+
         'mensalidade vai recusar. Preencha abaixo para resolver.</div></div>')+
    '<div class="grid3">'+
      '<div class="field"><label>Mensalidade (R$)</label>'+
        '<input type="number" class="input" id="ctValor" value="'+(c?numRaw(c.valor_mensal):350)+'" min="1" step="0.01" inputmode="decimal"></div>'+
      '<div class="field"><label>Dia do vencimento</label>'+
        '<input type="number" class="input" id="ctDia" value="'+(c?c.dia_vencimento:10)+'" min="1" max="28" inputmode="numeric"></div>'+
      '<div class="field"><label>Situação</label><select class="input" id="ctStatus">'+
        op('ativo','Ativo',c&&c.status)+op('suspenso','Suspenso',c&&c.status)+
        op('encerrado','Encerrado',c&&c.status)+'</select></div>'+
    '</div>'+
    '<div class="field"><label>Observação</label><textarea class="input" id="ctObs">'+esc((c&&c.observacao)||'')+'</textarea></div>';

  Modal.open({
    title:'Contrato', icon:'fa-file-contract', body:b,
    footer:'<button class="btn btn-outline" data-close>Cancelar</button>'+
           '<button class="btn btn-primary" id="ctSalvar"><i class="fa-solid fa-check"></i> Salvar</button>',
    onMount:ov=>{
      $('#ctSalvar',ov).addEventListener('click', async ()=>{
        const dia=Number($('#ctDia',ov).value);
        if(!(dia>=1 && dia<=28)){ Toast.err('Dia de vencimento inválido','Use um dia entre 1 e 28.'); return; }
        const valor=numRaw($('#ctValor',ov).value);
        if(!(valor>0)){ Toast.err('Valor inválido','A mensalidade precisa ser maior que zero.'); return; }
        try{
          await g.Cobranca.salvarContrato(empresaId, {
            valor_mensal:valor, dia_vencimento:dia,
            status:$('#ctStatus',ov).value,
            observacao:$('#ctObs',ov).value.trim()||null
          });
          Modal.close(); Toast.ok('Contrato salvo.');
        }catch(e){ Toast.err('Não foi possível salvar', e.message); }
      });
    }
  });
}

async function carregarCobrancas(){
  const alvo=$('#cbLista'); if(!alvo) return;
  const g=G();
  try{
    const lista = await g.Cobranca.lista($('#cbEmp').value || null);
    if(!lista.length){ alvo.innerHTML='<div class="card"><div class="card-pad"><div class="empty">Nenhuma cobrança ainda.</div></div></div>'; return; }

    const hoje = new Date().toISOString().slice(0,10);
    let aberto=0, pago=0;
    let linhas='';
    lista.forEach(c=>{
      const paga = !!c.pago_em;
      if (paga) pago += Number(c.valor)||0; else aberto += Number(c.valor)||0;
      const atrasada = !paga && c.vencimento < hoje;
      const bd = paga ? 'b-green' : (atrasada ? 'b-red' : 'b-amber');
      const rot = paga ? 'paga' : (atrasada ? 'atrasada' : 'em aberto');
      linhas += '<div class="item" style="display:flex;gap:12px;align-items:center;cursor:default">'+
        '<div style="flex:1;min-width:0">'+
          '<div style="font-weight:700">'+mesLabel(c.competencia)+'</div>'+
          '<div style="font-size:12.5px;color:var(--muted)">vence '+fmtDate(c.vencimento)+
            (paga?' · pago em '+fmtDate(c.pago_em)+(c.metodo?' ('+esc(c.metodo)+')':''):'')+'</div>'+
        '</div>'+
        '<div style="display:flex;align-items:center;gap:12px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end">'+
          '<div style="text-align:right">'+
            '<div style="font-weight:800">'+money(c.valor)+'</div>'+
            '<span class="badge '+bd+'">'+rot+'</span>'+
          '</div>'+
          '<button class="btn '+(paga?'btn-outline':'btn-green')+' btn-sm" data-pg="'+c.id+'" data-st="'+(paga?1:0)+'">'+
            (paga?'reabrir':'marcar paga')+'</button>'+
        '</div></div>';
    });

    alvo.innerHTML =
      '<div class="kpi-grid">'+
        '<div class="kpi k-amber"><div class="kl">Em aberto</div><div class="kv" style="font-size:18px">'+money(aberto)+'</div></div>'+
        '<div class="kpi k-green"><div class="kl">Recebido</div><div class="kv" style="font-size:18px">'+money(pago)+'</div></div>'+
      '</div><div class="list">'+linhas+'</div>';

    alvo.querySelectorAll('[data-pg]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        try{
          if (b.dataset.st==='1') await g.Cobranca.reabrir(b.dataset.pg);
          else await g.Cobranca.marcarPaga(b.dataset.pg,'PIX');
          carregarCobrancas();
        }catch(e){ Toast.err(e.message); }
      });
    });
  }catch(e){
    alvo.innerHTML='<div class="card"><div class="card-pad"><div class="empty">'+esc(e.message)+'</div></div></div>';
  }
}

      '<div class="mv-icon mv-out" style="background:var(--blue-soft);color:var(--blue)"><i class="fa-solid '+i[1]+'"></i></div>'+
      '<div class="pi-main"><b style="font-size:14px">'+esc(i[2])+'</b><small>'+esc(i[3])+'</small></div>'+
      '<i class="fa-solid fa-chevron-right" style="color:var(--gray-300);font-size:12px"></i></div>').join('')+'</div>';
  Modal.open({title:'Mais opções', icon:'fa-bars', body:b,
    footer:'<button class="btn btn-outline btn-block" data-close>Fechar</button>',
    onMount:ov=>$$('[data-go]',ov).forEach(x=>x.addEventListener('click',()=>{ Modal.close(); App.go(x.dataset.go); }))});
}
function menuRegistrar(){
  const b = '<div class="list">'+
    '<div class="pick-item" data-a="saida" style="padding:15px 13px"><div class="mv-icon mv-out"><i class="fa-solid fa-arrow-up"></i></div>'+
      '<div class="pi-main"><b style="font-size:14.5px">Nova saída</b><small>Enviar material do galpão para uma obra</small></div></div>'+
    '<div class="pick-item" data-a="entrada" style="padding:15px 13px"><div class="mv-icon mv-in"><i class="fa-solid fa-arrow-down"></i></div>'+
      '<div class="pi-main"><b style="font-size:14.5px">Nova entrada</b><small>Registrar recebimento de compra</small></div></div>'+
    '<div class="pick-item" data-a="xml" style="padding:15px 13px"><div class="mv-icon mv-direct"><i class="fa-solid fa-file-code"></i></div>'+
      '<div class="pi-main"><b style="font-size:14.5px">Importar XML de NF-e</b><small>Leitura automática da nota fiscal</small></div></div>'+
    '<div class="pick-item" data-a="devolucao" style="padding:15px 13px"><div class="mv-icon mv-ret"><i class="fa-solid fa-rotate-left"></i></div>'+
      '<div class="pi-main"><b style="font-size:14.5px">Devolução da obra</b><small>Material que sobrou e voltou ao galpão</small></div></div>'+
    '<div class="pick-item" data-a="ajuste" style="padding:15px 13px"><div class="mv-icon mv-adj"><i class="fa-solid fa-scale-balanced"></i></div>'+
      '<div class="pi-main"><b style="font-size:14.5px">Ajuste de inventário</b><small>Corrigir saldo após contagem</small></div></div>'+
  '</div>';
  Modal.open({title:'Registrar movimentação', icon:'fa-plus', body:b,
    footer:'<button class="btn btn-outline btn-block" data-close>Cancelar</button>',
    onMount:ov=>$$('[data-a]',ov).forEach(x=>x.addEventListener('click',()=>{
      const a=x.dataset.a; Modal.close();
      setTimeout(()=>{ if(a==='saida')Forms.novaSaida(); else if(a==='entrada')Forms.novaEntrada();
        else if(a==='xml')Forms.importarXML(); else if(a==='devolucao')Forms.novaDevolucao();
        else Forms.novoAjuste(); },180);
    }))});
}
function painelAlertas(){
  const al = Stock.alertas();
  let b;
  if(!al.length) b = emptyState('fa-circle-check','Tudo em ordem','Nenhum material abaixo do estoque mínimo.');
  else b = '<div class="list">'+al.map(r=>
      '<div class="item bl s-'+r.status+'" data-m="'+r.id+'">'+
        '<div class="item-top"><div style="flex:1"><div class="item-code">'+esc(r.codigo)+'</div>'+
        '<div class="item-title" style="font-size:13.5px">'+esc(r.descricao)+'</div></div>'+Stock.statusBadge(r.status)+'</div>'+
        '<div class="item-meta"><div class="mi"><span>Estoque</span><b>'+qty(r.saldo)+' '+esc(r.unidade)+'</b></div>'+
        '<div class="mi"><span>Mínimo</span><b>'+qty(r.minimo)+'</b></div>'+
        '<div class="mi"><span>Comprar</span><b style="color:var(--red)">'+qty(r.repor)+'</b></div></div></div>').join('')+'</div>';
  Modal.open({title:'Alertas de estoque ('+al.length+')', icon:'fa-bell', body:b,
    footer:'<button class="btn btn-outline" data-close>Fechar</button>'+
           (al.length?'<button class="btn btn-amber" onclick="Modal.close();Reports.listaCompras()"><i class="fa-solid fa-cart-shopping"></i> Lista de compras</button>':''),
    onMount:ov=>$$('[data-m]',ov).forEach(x=>x.addEventListener('click',()=>{ Modal.close(); Views.estoqueDetalhe(x.dataset.m); }))});
}

/* ==========================================================================
   BOOTSTRAP
   ========================================================================== */
/* Pontes para a camada de dados (módulos ES não enxergam const de script
   clássico). Usadas por assets/js/data.js e guard.js. */
window.App = App; window.Toast = Toast; window.Modal = Modal;
window.Stock = Stock; window.Mov = Mov; window.DB = DB; window.Tema = Tema;
window.Stories = Stories;

(function init(){
  $$('.sb[data-nav], .bn[data-nav]').forEach(b=>b.addEventListener('click',()=>App.go(b.dataset.nav)));
  $('#bnFab').addEventListener('click', menuRegistrar);
  $('#bnMore').addEventListener('click', menuMais);
  $('#btnMore').addEventListener('click', menuMais);
  $('#btnAlertsTop').addEventListener('click', painelAlertas);
  $('#btnTemaTop').addEventListener('click', ()=>Tema.alternar());
  Tema.init();

  App.go('dashboard');

  /* PWA: instalação, atalhos e atualização */
  try{ PWA.init(); }catch(e){ console.warn('[PWA]',e); }

  /* atalhos desktop */
  document.addEventListener('keydown', e=>{
    if(e.target.matches('input,textarea,select')) return;
    if(e.key==='e'||e.key==='E'){ Forms.novaEntrada(); }
    if(e.key==='s'||e.key==='S'){ Forms.novaSaida(); }
  });
})();
</script>
</body>
</html>
